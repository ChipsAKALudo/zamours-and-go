/* ============================ ACTIONS ============================ */

function bindAll() {
  document.querySelectorAll("[data-act]").forEach(n => {
    n.addEventListener("click", () => act(n.dataset.act, n.dataset));
  });
  if (S.screen === "edit") brancherEditeur();
}

// Retire toutes les animations en cours et oublie ce qu'elles ont déjà joué.
function nettoyerEffets() {
  announceKey = null; lastScreen = null; sponsorKey = null; flashKey = null;
  clearTimeout(announceTimer); clearTimeout(splashTimer); clearTimeout(sponsorTimer);
  hbreakPending = null; clearTimeout(hbreakTimer);
  annulerGag(); derniereQuestion = null;
  Object.keys(gagFait).forEach(k => delete gagFait[k]);
  document.querySelectorAll(".announce, .splash, .sponsor, .flash, .hbreak, .victory").forEach(n => n.remove());
  victoryKey = null; clearTimeout(victoryTimer);
}

// Un pack incomplet ne se joue pas : on montre ce qui manque au lieu de planter.
function jouable() {
  if (!validerPack(PACK).length) return true;
  S.screen = "pack";
  return false;
}

function act(a, data) {
  switch (a) {
    case "panel": S.panel = !S.panel; break;
    case "reset":
      if (!confirme("reset")) break;
      S = freshState();
      nettoyerEffets();
      break;
    case "go":
      if (data.to === "m1rules" && !jouable()) break;
      resetTimer(); S.revealCount = 0; S.screen = data.to; break;
    case "timer": startTimer(); return;
    case "treset": resetTimer(); break;

    case "m1mark": {
      const m = S.m1marks[S.m1i] || (S.m1marks[S.m1i] = {});
      if (m[data.id]) delete m[data.id]; else m[data.id] = 1;
      break;
    }
    case "m1next":
      resetTimer(); S.revealCount = 0;
      if (S.m1i === M1.length - 1) S.screen = "m1res";
      else S.m1i++;
      break;
    case "m1prev": resetTimer(); S.revealCount = 0; if (S.m1i > 0) S.m1i--; break;

    case "elim": {
      const i = S.eliminated.indexOf(data.id);
      if (i >= 0) S.eliminated.splice(i, 1);
      else if (S.eliminated.length < 2) S.eliminated.push(data.id);
      break;
    }
    case "usepack": {
      // au premier lancement il n'y a rien à perdre ; ensuite, la partie préparée serait écrasée
      if (packSauve() && !confirme("usepack-" + data.which)) break;
      appliquerPack(normaliserPack(MODELES[data.which]()));
      sauverPack();
      // point de départ fourni par le jeu : rien à perdre tant qu'on ne l'a pas modifié
      noterFichier({ nom: null, comment: null, quand: null, modifie: false });
      S = freshState();
      nettoyerEffets();
      // sans duos, la suite logique est de les créer
      if (!DUOS.length) { S.screen = "edit"; ONGLET = "duos"; CAT_OUVERTE = null; }
      break;
    }
    case "openpack": S.screen = "pack"; break;
    case "openedit": S.screen = "edit"; break;
    case "ed": actionEditeur(data); break;
    case "exportpack": exporterPack(); break;
    case "importpack": importerPack(); break;

    case "openresume3":
      if (!jouable()) break;
      S = freshState();
      S.screen = "resume3";
      break;
    case "pick3": {
      const id = data.id;
      const liste = data.role === "fin" ? "finalists" : "eliminated";
      const autre = data.role === "fin" ? "eliminated" : "finalists";
      const i = S[liste].indexOf(id);
      if (i >= 0) { S[liste].splice(i, 1); break; }
      const j = S[autre].indexOf(id);
      if (j >= 0) S[autre].splice(j, 1);          // un duo ne peut pas être les deux
      if (S[liste].length >= 2) S[liste].shift();  // 2 maximum : le plus ancien sort
      S[liste].push(id);
      break;
    }
    case "startresume3":
      S.m3marks = {}; S.m3i = 0;
      S.resumed = "m3";
      resetTimer();
      S.screen = "m3rules";
      break;

    case "openresume":
      if (!jouable()) break;
      S = freshState();
      S.screen = "resume";
      break;
    case "pickresume": {
      const i = S.m2order.indexOf(data.id);
      if (i >= 0) S.m2order.splice(i, 1); else S.m2order.push(data.id);
      // on garde l'ordre de la liste DUOS pour l'ordre de passage
      S.m2order = DUOS.filter(d => S.m2order.includes(d.id)).map(d => d.id);
      break;
    }
    case "startresume":
      S.eliminated = DUOS.filter(d => !S.m2order.includes(d.id)).map(d => d.id);
      S.m2i = 0; S.m2step = 0; S.m2cat = {}; S.m2drawn = {}; S.m2used = {}; S.m2marks = {};
      S.resumed = "m2";
      resetTimer();
      S.screen = "m2rules";
      break;

    case "startm2":
      // repartir d'une manche vierge, même après un aller-retour depuis l'élimination
      S.m2order = alive().map(d => d.id);
      S.m2i = 0; S.m2step = 0; S.revealCount = 0;
      S.m2cat = {}; S.m2drawn = {}; S.m2used = {}; S.m2marks = {};
      resetTimer();
      S.screen = "m2rules";
      break;

    case "pickcat": {
      const roundKey = m2duo().id + "-r" + S.m2step;
      if (!S.m2used) S.m2used = {};
      const used = S.m2used[data.cat] || (S.m2used[data.cat] = []);
      const cat = categorieParId(data.cat);
      if (!cat) break;
      const avail = cat.questions.map((_, i) => i).filter(i => !used.includes(i));
      if (!avail.length) break;
      const qi = avail[Math.floor(Math.random() * avail.length)];
      used.push(qi);
      S.m2cat[roundKey] = data.cat;
      S.m2drawn[roundKey] = qi;
      S.revealCount = 0;
      break;
    }
    case "m2mark":
      if (S.m2marks[data.key]) delete S.m2marks[data.key]; else S.m2marks[data.key] = 1;
      break;
    case "m2next":
      resetTimer(); S.revealCount = 0;
      if (S.m2i < S.m2order.length - 1) S.m2i++;
      else if (S.m2step < M2_TOURS - 1) { S.m2step++; S.m2i = 0; }
      else S.screen = "m2res";
      break;
    case "m2prev":
      resetTimer(); S.revealCount = 0;
      if (S.m2i > 0) S.m2i--;
      else if (S.m2step > 0) { S.m2step--; S.m2i = S.m2order.length - 1; }
      break;

    case "final": {
      const i = S.finalists.indexOf(data.id);
      if (i >= 0) S.finalists.splice(i, 1);
      else if (S.finalists.length < 2) S.finalists.push(data.id);
      break;
    }
    case "stophere": S.finalists = []; S.screen = "end"; break;
    case "startm3":
      S.m3marks = {}; S.m3i = 0; S.sudden = false; S.suddenWinner = null;
      resetTimer(); S.screen = "m3rules";
      break;
    case "m3mark": {
      const k = S.m3i + "|" + data.id;
      if (S.m3marks[k]) delete S.m3marks[k]; else S.m3marks[k] = 1;
      break;
    }
    case "m3next":
      queueHeartBreak();
      resetTimer(); S.m3i++;
      break;
    case "m3prev": resetTimer(); if (S.m3i > 0) S.m3i--; break;
    case "startsudden":
      S.sudden = true;
      S.m3i++;
      resetTimer();
      break;
    case "sdwin":
      S.suddenWinner = data.id;
      S.screen = "end";
      break;
    case "finish": queueHeartBreak(); S.screen = "end"; break;

    case "cible": S.cible[data.id] = S.cible[data.id] === "a" ? "b" : "a"; break;
  }
  render();
}

/* ============================ CLAVIER ============================ */

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  // écrans de préparation : aucun raccourci de jeu (Espace y lançait le chrono en fond)
  if (["edit", "pack", "choix"].includes(S.screen)) return;
  const k = e.key.toLowerCase();

  if (k === "s") { e.preventDefault(); act("panel", {}); return; }
  if (k === "r") { e.preventDefault(); S.revealCount = (S.revealCount || 0) + 1; optJustRevealed = true; render(); return; }
  if (e.code === "Space") { e.preventDefault(); startTimer(); return; }

  if (k === "arrowright") {
    e.preventDefault();
    if (S.screen === "title") act("go", { to: "m1rules" });
    else if (S.screen === "m1") act("m1next", {});
    else if (S.screen === "m1res" && S.eliminated.length === 2) act("startm2", {});
    else if (S.screen === "m2") { const d = m2duo(); if (!(S.m2step > 0 && !S.m2cat[d.id + "-r" + S.m2step])) act("m2next", {}); }
    else if (S.screen === "m2res" && S.finalists.length === 2) act("startm3", {});
    else if (S.screen === "m3") { if (S.sudden || !S.finalists.some(m3Out)) act("m3next", {}); }
    else if (S.screen.endsWith("rules")) act("go", { to: S.screen.replace("rules", "") });
    return;
  }

  if (k === "arrowleft") {
    e.preventDefault();
    if (S.screen === "m1") act("m1prev", {});
    else if (S.screen === "m2") act("m2prev", {});
    return;
  }
});


/* ========================= ÉDITEUR DE PACK =========================
   Principe d'ergonomie : les champs texte ne déclenchent PAS de re-rendu.
   Un re-rendu à chaque frappe ferait perdre le curseur. On écrit dans le
   pack sur l'événement "change" (donc à la sortie du champ), on sauvegarde,
   et on ne rafraîchit que le bandeau d'état. Le rendu complet est réservé
   aux actions de structure : ajouter, supprimer, déplacer.
   =================================================================== */

let ONGLET = "duos";
let CAT_OUVERTE = null;

function lireChemin(o, chemin) {
  return chemin.split(".").reduce((x, k) => (x == null ? x : x[k]), o);
}
function ecrireChemin(o, chemin, val) {
  const ks = chemin.split(".");
  const dernier = ks.pop();
  const cible = ks.reduce((x, k) => x[k], o);
  cible[dernier] = val;
}

function idUnique(prefixe) {
  let n = 1, id;
  do { id = prefixe + n++; } while (PACK.duos.some(d => d.id === id) || PACK.categories.some(c => c.id === id));
  return id;
}

function questionVide() { return { q: "", opts: [], note: "", sponsor: null }; }

/* --- petits composants de formulaire --- */

function champ(label, chemin, valeur, type) {
  return `<label class="ed-f"><span>${esc(label)}</span>
    <input type="${type || "text"}" data-path="${esc(chemin)}" value="${esc(valeur == null ? "" : valeur)}"></label>`;
}

function zone(label, chemin, valeur, lignes) {
  return `<label class="ed-f"><span>${esc(label)}</span>
    <textarea rows="${lignes || 2}" data-path="${esc(chemin)}">${esc(valeur || "")}</textarea></label>`;
}

// Liste d'options de QCM : 0 = pas un QCM, sinon 2 ou 3 lettres.
function blocOpts(chemin, opts) {
  return `<div class="ed-opts">
    <div class="ed-lbl">QCM — ${opts.length ? opts.length + " option" + (opts.length > 1 ? "s" : "") : "aucune option, question ouverte"}</div>
    ${opts.map((o, i) => `<div class="ed-opt">
      <span class="ed-letter">${"ABCDEF"[i]}</span>
      <input type="text" data-path="${esc(chemin)}.${i}" value="${esc(o)}">
      <button class="ed-x" data-act="ed" data-op="delopt" data-path="${esc(chemin)}" data-i="${i}" title="Supprimer cette option">✕</button>
    </div>`).join("")}
    ${opts.length < 6 ? `<button class="ed-add" data-act="ed" data-op="addopt" data-path="${esc(chemin)}">+ option</button>` : ""}
  </div>`;
}

function blocSponsor(chemin, sp) {
  const actif = !!(sp && sp.by.trim());
  return `<details class="ed-det" ${sp ? "open" : ""}>
    <summary>Bandeau sponsor ${actif ? "— actif" : "(facultatif)"}</summary>
    ${champ("Présenté par", chemin + ".by", sp ? sp.by : "")}
    ${champ("Mention en petit", chemin + ".fine", sp ? sp.fine : "")}
    <div class="ed-hint">Laisse « Présenté par » vide pour désactiver le bandeau.</div>
  </details>`;
}

// ✕ de suppression : deux clics, comme le Reset — un duo ou une catégorie
// entière ne doit pas disparaître sur un clic égaré.
function boutonSuppr(op, i, titre) {
  const cle = "ed-" + op + "-" + i;
  return `<button class="ed-x danger ${arme === cle ? "arme" : ""}" data-act="ed" data-op="${op}" data-i="${i}" title="${titre}">${arme === cle ? "Supprimer ?" : "✕"}</button>`;
}

function boutonsOrdre(op, i, n) {
  return `<span class="ed-ord">
    <button class="ed-x" data-act="ed" data-op="${op}" data-i="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} title="Monter">↑</button>
    <button class="ed-x" data-act="ed" data-op="${op}" data-i="${i}" data-dir="1" ${i === n - 1 ? "disabled" : ""} title="Descendre">↓</button>
  </span>`;
}

function ongletM3() {

/* --- l'écran --- */

SCREENS.edit = {
  top: () => railBase(`Éditeur · <strong>${esc(PACK.meta.nom || "sans nom")}</strong>`),
  stage: () => {
    const onglets = [["duos", "Duos & Jokers", PACK.duos.length],
                     ["m1", "Manche 1", PACK.manche1.length],
                     ["cats", "Catégories", PACK.categories.reduce((t, c) => t + c.questions.length, 0)],

      </div>

function statutPackHTML() {
  const err = validerPack(PACK);
  return err.length
    ? `<span class="ko">${err.length} point${err.length > 1 ? "s" : ""} à corriger :</span> ${esc(err.join(" · "))}`
    : `<span class="ok">✓ Pack complet et jouable</span>`;
}

function rafraichirStatut() {
  const n = document.getElementById("ed-status");
  if (n) n.innerHTML = statutPackHTML();
}

/* --- écriture des champs, sans re-rendu --- */

function brancherEditeur() {
  document.querySelectorAll(".editor [data-path]").forEach(n => {
    // Le texte s'enregistre à chaque frappe : un onglet fermé en plein milieu
    // ne perd rien. Les nombres attendent la sortie du champ, sinon le
    // minimum forcé réécrirait le champ pendant qu'on le vide pour retaper.
    const texte = n.tagName === "TEXTAREA" || n.type === "text";
    n.addEventListener(texte ? "input" : "change", () => {
      const p = n.dataset.path;
      let v;
      if (n.type === "checkbox") v = n.checked;
      else if (n.type === "number") v = Math.max(1, parseInt(n.value, 10) || 1);
      else v = n.value;

      // Le sponsor garde ses deux champs même tant que « présenté par » est
      // vide (sinon la mention tapée en premier serait perdue) ; le jeu
      // l'ignore tant qu'il n'y a pas de « présenté par ».
      if (/\.sponsor\.(by|fine)$/.test(p)) {
        const base = p.replace(/\.(by|fine)$/, "");
        const sp = lireChemin(PACK, base) || { by: "", fine: "" };
        sp[p.endsWith(".by") ? "by" : "fine"] = v;
        ecrireChemin(PACK, base, sp);
      } else {
        ecrireChemin(PACK, p, v);
      }
      appliquerPack(PACK);
      sauverPack();
      marquerModifie();
      rafraichirStatut();
      if (n.type === "number") n.value = lireChemin(PACK, p);
    });
  });
}

/* --- actions de structure : elles, provoquent un re-rendu --- */

function actionEditeur(d) {
  const i = parseInt(d.i, 10);
  const cat = PACK.categories.find(x => x.id === CAT_OUVERTE);
  if (d.op.startsWith("del") && d.op !== "delopt" && !confirme("ed-" + d.op + "-" + i)) return;
  switch (d.op) {
    case "tab": ONGLET = d.k; CAT_OUVERTE = null; break;
    case "addduo": PACK.duos.push({ id: idUnique("duo"), a: "", b: "", joker: { gag: "", q: "", opts: [] } }); break;
    case "delduo": PACK.duos.splice(i, 1); break;
    case "moveduo": deplacer(PACK.duos, i, parseInt(d.dir, 10)); break;
    case "addm1": PACK.manche1.push(Object.assign(questionVide(), { type: "eclair", pts: 1 })); break;
    case "delm1": PACK.manche1.splice(i, 1); break;
    case "movem1": deplacer(PACK.manche1, i, parseInt(d.dir, 10)); break;
    case "addcat": PACK.categories.push({ id: idUnique("cat"), label: "Nouvelle catégorie", questions: [] }); break;
    case "delcat": PACK.categories.splice(i, 1); break;
    case "opencat": CAT_OUVERTE = d.id; break;
    case "closecat": CAT_OUVERTE = null; break;
    case "addq": if (cat) cat.questions.push(questionVide()); break;
    case "delq": if (cat) cat.questions.splice(i, 1); break;
    case "moveq": if (cat) deplacer(cat.questions, i, parseInt(d.dir, 10)); break;
    case "addm3": PACK.manche3.push(questionVide()); break;
    case "delm3": PACK.manche3.splice(i, 1); break;
    case "movem3": deplacer(PACK.manche3, i, parseInt(d.dir, 10)); break;
    case "addopt": { const a = lireChemin(PACK, d.path); if (a.length < 6) a.push(""); break; }
    case "delopt": { const a = lireChemin(PACK, d.path); a.splice(i, 1); break; }
  }
  appliquerPack(PACK);
  sauverPack();
  // changer d'onglet ou ouvrir une catégorie ne modifie pas la partie
  if (!["tab", "opencat", "closecat"].includes(d.op)) marquerModifie();
  // une partie en cours peut citer le duo qu'on vient de retirer
  S = hydrate(S);
}

function deplacer(arr, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  const [x] = arr.splice(i, 1);
  arr.splice(j, 0, x);
}

/* ---------- import / export du pack ---------- */

// Message dans la zone prévue de l'écran, ou en bandeau passager s'il n'y en a pas (éditeur).
function messagePack(txt) {
  const n = document.getElementById("packmsg");
  if (n) { n.textContent = txt; return; }
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = el(`<div class="toast" role="status">${esc(txt)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 7000);
}

// « Z'amours and Go » → « zamours-and-go.json », « Soirée d'été » → « soiree-dete.json »
function nomDeFichier(pk, prefixe) {
  const nom = (pk.meta.nom || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return (prefixe || "") + (nom || "partie") + ".json";
}

// Télécharge la partie ; renvoie le nom du fichier, ou null si le navigateur refuse.
function telecharger(pk, prefixe) {
  const nom = nomDeFichier(pk, prefixe);
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(pk, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return nom;
  } catch (e) { return null; }
}

function exporterPack() {
  const nom = telecharger(PACK);
  if (nom) {
    noterFichier({ nom, comment: "enregistree", quand: Date.now(), modifie: false });
    rafraichirSauvegarde();
    messagePack(`Partie enregistrée dans tes Téléchargements, sous « ${nom} ». Garde ce fichier : c'est lui qu'on rouvre la prochaine fois.`);
    return;
  }
  // page cloisonnée : le téléchargement peut être bloqué, on passe par le presse-papiers
  try {
    navigator.clipboard.writeText(JSON.stringify(PACK, null, 2));
    messagePack("Téléchargement bloqué par le navigateur — la partie a été copiée dans le presse-papiers.");
  } catch (e2) {
    messagePack("Impossible d'enregistrer ici. Ouvre le jeu depuis ton disque plutôt que dans un aperçu.");
  }
}

function ouvrirFichier(f) {
  const fr = new FileReader();
  fr.onload = () => {
    let pk;
    try {
      const brut = JSON.parse(fr.result);
      // n'importe quel JSON n'est pas une partie : sans ce contrôle, un fichier
      // étranger remplacerait la partie actuelle par une partie vide
      if (!brut || !Array.isArray(brut.duos) || !Array.isArray(brut.manche1)) throw new Error("pas une partie");
      pk = normaliserPack(brut);
    } catch (e) {
      messagePack(`« ${f.name} » ne peut pas être ouvert : ce n'est pas une partie enregistrée par ce jeu.`);
      return;
    }
    // la partie remplacée avait des modifications jamais enregistrées : on en garde une copie
    const copie = FICHIER.modifie && packSauve() ? telecharger(PACK, "copie-avant-ouverture-") : null;
    appliquerPack(pk);
    sauverPack();
    noterFichier({ nom: f.name, comment: "ouverte", quand: Date.now(), modifie: false });
    S = freshState();
    nettoyerEffets();
    S.screen = "pack";
    render();
    const err = validerPack(pk);
    messagePack((err.length
        ? `Partie ouverte, mais ${err.length} point${err.length > 1 ? "s" : ""} à corriger avant de jouer.`
        : "Partie ouverte et prête à jouer.")
      + (copie ? ` Ta partie précédente n'était pas enregistrée : une copie a été téléchargée (« ${copie} »).` : ""));
  };
  fr.readAsText(f);
}

function importerPack() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.onchange = () => { if (inp.files && inp.files[0]) ouvrirFichier(inp.files[0]); };
  inp.click();
}

// Glisser un fichier .json sur la page l'ouvre, comme « 📂 Ouvrir une partie ».
// Sans preventDefault, le navigateur quitterait le jeu pour afficher le fichier.
document.addEventListener("dragover", e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
});
document.addEventListener("drop", e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f) return;
  e.preventDefault();
  // en plein jeu, un fichier lâché par erreur remettrait la partie à zéro
  if (!["title", "choix", "pack", "edit"].includes(S.screen)) {
    messagePack("Pour ouvrir une partie, reviens d'abord à l'écran titre.");
    return;
  }
  ouvrirFichier(f);
});

/* ============================ AUTO-TEST ============================
   Ouvrir la page avec #autotest à la fin de l'adresse : joue une partie
   complète avec le pack chargé, sans rien sauvegarder, puis affiche ce qui
   casse. À relancer après toute modification du moteur.
   ================================================================== */

function autotest() {
  const pb = [];
  const sauve = S;
  const packReel = PACK;
  AUTOTEST = true;

  const texteVisible = () => [...document.querySelectorAll("#app, #panel, .splash, .announce, .flash, .sponsor, .hbreak, .victory")]
    .map(n => n.textContent).join(" ");
  const joue = (etape, a, data) => {
    try {
      act(a, data || {});
      const m = texteVisible().match(/.{0,40}\b(undefined|NaN|null)\b|\[object \w+\]/);
      if (m) pb.push(`${etape} : « ${m[0].trim()} » à l'écran`);
    } catch (e) { pb.push(`${etape} : plantage — ${e.message}`); }
  };

  try {
    // 0. repère du prénom : les trois points tapés au clavier valent « … »
    ["Le plat de ... ?", "Le plat de … ?"].forEach(t => {
      const h = qText(t, "Zoé");
      if ((h.match(/Zoé/g) || []).length !== 1 || /\.\.\.|…/.test(h)) pb.push(`repère du prénom : « ${t} » donne « ${h} »`);
    });

    // 1. un pack incomplet ne doit pas se lancer (il plantait la Manche 1)
    appliquerPack(normaliserPack(JSON.parse(JSON.stringify(PACK_VIDE))));
    S = freshState();
    joue("pack vide", "go", { to: "m1rules" });
    if (S.screen !== "pack") pb.push("pack vide : la partie démarre au lieu d'afficher ce qui manque");
    appliquerPack(packReel);

    // Une partie en cours de préparation (sans duos, par exemple) n'est pas un
    // défaut du moteur : on joue alors la partie de juillet 2026, toujours complète.
    autotest.partieJouee = "la partie chargée";
    if (validerPack(PACK).length) {
      appliquerPack(normaliserPack(MODELES.demo()));
      autotest.partieJouee = "la partie de juillet 2026 (la partie chargée n'est pas encore jouable)";
    }

    // 2. Manche 1 : le duo k marque sur la question i si k <= i (modulo)
    S = freshState();
    joue("règles Manche 1", "go", { to: "m1rules" });
    joue("Manche 1", "go", { to: "m1" });
    const attendu = {};
    DUOS.forEach(d => attendu[d.id] = 0);
    M1.forEach((q, i) => {
      // comparé à opts.length, pas à aDesOptions() : le test ne doit pas partager le code qu'il vérifie
      const masque = !!document.querySelector("#stage .hidden-note");
      if (masque !== q.opts.length > 0) pb.push(`Manche 1, question ${i + 1} : « options masquées » ${masque ? "affiché sans QCM" : "absent sur un QCM"}`);
      DUOS.forEach((d, k) => {
        if (k <= i % DUOS.length) { joue(`Manche 1, question ${i + 1}`, "m1mark", { id: d.id }); attendu[d.id] += q.pts; }
      });
      joue(`Manche 1, question ${i + 1}`, "m1next");
    });
    const s1 = scoresM1();
    DUOS.forEach(d => { if (s1[d.id] !== attendu[d.id]) pb.push(`scores Manche 1 : ${duoName(d)} a ${s1[d.id]} au lieu de ${attendu[d.id]}`); });
    if (S.screen !== "m1res") pb.push("Manche 1 : n'arrive pas à l'élimination");

    // 3. Manche 2 : les 2 derniers sortent, chaque duo marque à chaque tour
    rank(s1, DUOS).slice(-2).forEach(d => joue("élimination", "elim", { id: d.id }));
    joue("lancer la Manche 2", "startm2");
    joue("Manche 2", "go", { to: "m2" });
    let garde = 0;
    while (S.screen === "m2" && garde++ < 500) {
      const d = m2duo();
      if (S.m2step > 0 && !S.m2cat[d.id + "-r" + S.m2step]) {
        const c = PACK.categories.find(c => c.questions.length > (S.m2used[c.id] || []).length);
        if (!c) { pb.push("Manche 2 : plus aucune question à tirer"); break; }
        joue("Manche 2, choix du thème", "pickcat", { cat: c.id });
      }
      joue("Manche 2, point", "m2mark", { key: d.id + (S.m2step ? "-r" + S.m2step : "-j") });
      joue("Manche 2, suivant", "m2next");
    }
    if (S.screen !== "m2res") pb.push("Manche 2 : n'arrive pas au classement");
    Object.entries(scoresM2()).forEach(([id, v]) => {
      if (v !== M2_POINTS) pb.push(`scores Manche 2 : ${duoName(byId(id))} a ${v} au lieu de ${M2_POINTS}`);
    });

    // 4. finale : le premier finaliste perd tous ses cœurs
    rank(scoresM2(), alive()).slice(0, 2).forEach(d => joue("finalistes", "final", { id: d.id }));
    joue("lancer la finale", "startm3");
    joue("finale", "go", { to: "m3" });
    const perdant = S.finalists[0];
    garde = 0;
    while (perdant && !m3Out(perdant) && garde++ < 100) {
      joue("finale, cœur perdu", "m3mark", { id: perdant });
      if (!m3Out(perdant)) joue("finale, suivante", "m3next");
    }
    joue("vainqueur", "finish");
    if (S.screen !== "end") pb.push("finale : pas d'écran de clôture");
    else if (endResult().win !== duoName(byId(S.finalists[1]))) pb.push("clôture : mauvais vainqueur");
    joue("panneau des scores", "panel");
  } finally {
    appliquerPack(packReel);
    S = sauve;
    AUTOTEST = false;
    nettoyerEffets();
    render();
  }
  return pb;
}

function afficherAutotest() {
  const pb = autotest();
  window.resultatAutotest = pb;   // lisible par un outil qui pilote le navigateur
  console[pb.length ? "error" : "log"]("Auto-test :", pb.length ? pb : "OK");
  document.querySelectorAll(".autotest").forEach(n => n.remove());
  const n = el(`<div class="autotest" style="position:fixed;left:16px;bottom:16px;z-index:9999;max-width:720px;
      max-height:60vh;overflow:auto;padding:14px 18px;background:#fff;border:3px solid #000;border-radius:10px;
      font:14px/1.5 system-ui,sans-serif;box-shadow:6px 6px 0 #000">
      <strong>${pb.length ? "✗ Auto-test : " + pb.length + " problème" + (pb.length > 1 ? "s" : "") : "✓ Auto-test : partie complète jouée sans erreur"}</strong>
      <div style="color:#666">Jouée avec ${esc(autotest.partieJouee || "la partie chargée")}.</div>
      ${pb.map(p => `<div>• ${esc(p)}</div>`).join("")}
      <div style="margin-top:8px;color:#666">Clique pour fermer.</div>
    </div>`);
  n.addEventListener("click", () => n.remove());
  document.body.appendChild(n);
}

/* ============================ BOOT ============================ */

// Trappe de secours : ouvrir la page avec #reset à la fin de l'URL efface la
// sauvegarde AVANT tout rendu. Utile si une partie corrompue empêche même
// l'affichage du bouton Reset.
try {
  if (/reset/i.test(location.hash) || /reset/i.test(location.search)) {
    localStorage.removeItem(KEY);
  }
} catch (e) {}

// Si l'état sauvegardé est inexploitable, on repart de zéro plutôt que de
// laisser une page blanche.
// Ajouter #reset à une page DÉJÀ ouverte ne la recharge pas : on écoute donc
// aussi le changement d'ancre pour que la trappe marche dans les deux cas.
window.addEventListener("hashchange", () => {
  if (/autotest/i.test(location.hash)) { afficherAutotest(); return; }
  if (!/reset/i.test(location.hash)) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  S = freshState();
  arme = null;
  nettoyerEffets();
  render();
});

// Le pack doit être chargé AVANT l'état de partie : le moteur en dépend.
if (!chargerPack()) {
  appliquerPack(normaliserPack(JSON.parse(JSON.stringify(PACK_DEFAUT))));
}
lireFichier();

try {
  load();
  if (!packSauve() && S.screen === "title") S.screen = "choix";
  render();
} catch (e) {
  console.error("État illisible, retour à l'écran de titre :", e);
  try { localStorage.removeItem(KEY); } catch (e2) {}
  S = freshState();
  render();
}

if (/autotest/i.test(location.hash)) afficherAutotest();
</script>
