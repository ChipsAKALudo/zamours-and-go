<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z'amours and Go — Pupitre</title>

<style>
  /* =========================================================
     Z'AMOURS AND GO — habillage romance-comic / pop art
     Papier journal crème · encre noire épaisse · trame Ben-Day
     Rose bonbon · cyan d'imprimerie · jaune criard · cœurs
     ========================================================= */

  :root {
    /* d'après le plateau : ciel clair, rouge glossy, jaune, bleu roi,
       et le liseré blanc de détourage autour de chaque élément */
    --ground:      #E9F3FD;   /* ciel de plateau */
    --ground-2:    #D3E7FA;   /* bandeau plus soutenu */
    --raised:      #FFFFFF;
    --line:        #12100F;   /* trait noir des illustrations */
    --ink:         #12100F;
    --muted:       #4E6C88;
    --rose:        #E5231F;   /* le rouge du cœur */
    --rose-dim:    #A80F12;
    --amber:       #1E56A0;   /* bleu roi (accent secondaire) */
    --yellow:      #FFCE00;   /* le jaune du logo */
    --match:       #FFCE00;
    --miss:        #8FA7BC;

    --display: Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Narrow Bold", sans-serif;
    --heavy: "Arial Black", "Segoe UI Black", Impact, sans-serif;
    --script: "Brush Script MT", "Segoe Script", "Bradley Hand", cursive;
    --body: "Segoe UI", system-ui, -apple-system, sans-serif;
    --data: Consolas, "SF Mono", ui-monospace, monospace;

    --pad: clamp(16px, 2.2vw, 34px);
    /* le détourage blanc + son ombre douce, comme les décors du plateau */
    --cutout: 0 0 0 9px #fff, 0 12px 28px rgba(20,50,90,.22);
    --cutout-sm: 0 0 0 5px #fff, 0 6px 16px rgba(20,50,90,.20);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background: linear-gradient(#F8FCFF 0%, var(--ground) 45%, #D9EAF8 100%);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* Trame Ben-Day en dégradé : points minuscules en haut, de plus en plus
     gros vers le bas jusqu'à saturer en aplat. Chaque bande est un calque
     avec son propre rayon de point et son propre masque de fondu.
     Le pas (--dot-grid) est commun à toutes : les points restent alignés. */
  .halftone {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    --dot-grid: 15px;
    --dot-col: 30, 86, 160;
  }
  .halftone i {
    position: absolute;
    inset: 0;
    display: block;
    background-size: var(--dot-grid) var(--dot-grid);
  }
  .halftone i:nth-child(1) {
    background-image: radial-gradient(rgba(var(--dot-col), .16) 1.2px, transparent 1.3px);
    -webkit-mask-image: linear-gradient(#000 0%, #000 16%, transparent 30%);
            mask-image: linear-gradient(#000 0%, #000 16%, transparent 30%);
  }
  .halftone i:nth-child(2) {
    background-image: radial-gradient(rgba(var(--dot-col), .17) 2.1px, transparent 2.2px);
    -webkit-mask-image: linear-gradient(transparent 14%, #000 30%, transparent 46%);
            mask-image: linear-gradient(transparent 14%, #000 30%, transparent 46%);
  }
  .halftone i:nth-child(3) {
    background-image: radial-gradient(rgba(var(--dot-col), .18) 3.2px, transparent 3.3px);
    -webkit-mask-image: linear-gradient(transparent 30%, #000 46%, transparent 62%);
            mask-image: linear-gradient(transparent 30%, #000 46%, transparent 62%);
  }
  .halftone i:nth-child(4) {
    background-image: radial-gradient(rgba(var(--dot-col), .19) 4.6px, transparent 4.7px);
    -webkit-mask-image: linear-gradient(transparent 46%, #000 62%, transparent 76%);
            mask-image: linear-gradient(transparent 46%, #000 62%, transparent 76%);
  }
  .halftone i:nth-child(5) {
    background-image: radial-gradient(rgba(var(--dot-col), .20) 6.4px, transparent 6.5px);
    -webkit-mask-image: linear-gradient(transparent 60%, #000 76%, transparent 90%);
            mask-image: linear-gradient(transparent 60%, #000 76%, transparent 90%);
  }
  /* dernière bande : les points se touchent, la trame devient un aplat */
  .halftone i:nth-child(6) {
    background-image: radial-gradient(rgba(var(--dot-col), .21) 9.4px, transparent 9.5px);
    -webkit-mask-image: linear-gradient(transparent 74%, #000 92%);
            mask-image: linear-gradient(transparent 74%, #000 92%);
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- rails ---------- */

  .rail {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px var(--pad);
    background: var(--raised);
    border-bottom: 4px solid var(--ink);
  }

  .rail.bottom {
    border-bottom: 0;
    border-top: 4px solid var(--ink);
  }

  .eyebrow {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(14px, 1.15vw, 19px);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .eyebrow strong { color: var(--rose-dim); font-weight: 400; }

  .spacer { margin-left: auto; }

  /* progression en cœurs */
  .pips { display: flex; gap: 6px; align-items: center; }
  .pip {
    width: auto; height: auto;
    background: none;
    font-size: 17px;
    line-height: 1;
    color: rgba(20,9,15,.20);
  }
  .pip::before { content: "♥"; }
  .pip.done { color: var(--rose); }
  .pip.now {
    color: var(--yellow);
    font-size: 25px;
    -webkit-text-stroke: 2px var(--ink);
  }

  /* ---------- stage ---------- */

  .stage {
    padding: clamp(12px, 2.2vh, 38px) var(--pad);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 1.6vh, 22px);
    overflow-y: auto;
    min-height: 0;
  }

  .kicker {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: clamp(14px, 1.2vw, 20px);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* étiquette de régime : cartouche de bande dessinée, posé de travers */
  .kicker .tag {
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 0;
    padding: 4px 12px;
    font-size: .92em;
    letter-spacing: .08em;
    box-shadow: var(--cutout-sm);
    transform: rotate(-1.6deg);
  }

  /* ---------- LA BULLE — élément signature ---------- */

  .question {
    font-family: var(--heavy);
    font-weight: 400;
    font-size: clamp(21px, min(3.2vw, 4.2vh), 54px);
    line-height: 1.08;
    text-wrap: balance;
    margin: 0 0 30px;
    max-width: 22ch;
    background: var(--raised);
    border: 4px solid var(--ink);
    border-radius: 30px;
    padding: clamp(16px, 2.2vh, 28px) clamp(20px, 2.4vw, 36px);
    box-shadow: var(--cutout);
    position: relative;
  }

  /* la queue de la bulle : triangle d'encre + triangle blanc par-dessus */
  .question::before,
  .question::after {
    content: "";
    position: absolute;
    width: 0; height: 0;
    border-style: solid;
  }
  .question::before {
    left: 48px; bottom: -40px;
    border-width: 42px 30px 0 0;
    border-color: var(--ink) transparent transparent transparent;
  }
  .question::after {
    left: 56px; bottom: -26px;
    border-width: 28px 19px 0 0;
    border-color: var(--raised) transparent transparent transparent;
  }

  .question.long  { font-size: clamp(19px, min(2.3vw, 3.2vh), 38px); max-width: 32ch; }
  .question.xlong { font-size: clamp(15px, min(1.6vw, 2.3vh), 27px); max-width: 48ch; line-height: 1.2; }

  /* QCM ouvert : la question a déjà été lue, elle cède la place aux options */
  .question.compact {
    font-size: clamp(18px, min(2.05vw, 3.2vh), 32px);
    max-width: 38ch;
    line-height: 1.16;
    padding: 12px clamp(16px, 1.8vw, 26px);
    margin-bottom: 26px;
  }
  .question.compact::before { bottom: -30px; border-width: 32px 23px 0 0; }
  .question.compact::after  { left: 54px; bottom: -19px; border-width: 21px 15px 0 0; }
  .question.compact + .options { gap: clamp(6px, .9vh, 10px); }
  .question.compact + .options .option {
    padding: clamp(7px, 1.1vh, 10px) 17px;
    font-size: clamp(12px, min(1.05vw, 1.6vh), 17px);
    line-height: 1.35;
  }

  /* le chrono se fait plus discret pendant la lecture des options */
  .stage:has(.question.compact) {
    gap: clamp(9px, 1.3vh, 17px);
    padding-top: clamp(10px, 1.6vh, 26px);
    padding-bottom: clamp(10px, 1.6vh, 26px);
  }
  .stage:has(.question.compact) .ring { width: 54px; height: 54px; }
  .stage:has(.question.compact) .count { font-size: clamp(26px, min(2.6vw, 4vh), 42px); }
  .stage:has(.question.compact) .timerwrap { gap: 14px; }
  .stage:has(.question.compact) .ring { width: 46px; height: 46px; }
  .stage:has(.question.compact) .subline { font-size: clamp(12px, min(1vw, 1.6vh), 17px); }
  .stage:has(.question.compact) .question { margin-bottom: 22px; }
  .stage:has(.question.compact) .question::before { bottom: -26px; border-width: 28px 20px 0 0; }
  .stage:has(.question.compact) .question::after  { left: 52px; bottom: -16px; border-width: 18px 13px 0 0; }

  /* le repère de cible, surligné comme le prénom dans la pastille */
  .ph {
    font-weight: 900;
    background: linear-gradient(
      transparent 56%, var(--yellow) 56%, var(--yellow) 94%, transparent 94%);
    padding: 0 .1em;
    white-space: nowrap;
  }

  /* bandeau des rôles : qui écrit, qui devine */
  .roles {
    display: inline-block;
    font-size: clamp(12px, min(1.05vw, 1.7vh), 18px);
    line-height: 1.3;
    color: var(--ink);
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: var(--cutout-sm);
    padding: clamp(4px, .7vh, 8px) clamp(12px, 1.3vw, 20px);
    max-width: 96ch;
  }
  .roles b { color: var(--rose-dim); }
  .roles .ph { font-weight: 700; }
  .roles.qcm { background: var(--yellow); }
  .roles.fini { background: var(--yellow); border-color: var(--ink); }
  .roles.qcm b { color: var(--ink); }

  .subline {
    font-size: clamp(15px, 1.25vw, 21px);
    color: var(--muted);
    max-width: 62ch;
    line-height: 1.5;
  }

  .subline em { color: var(--ink); font-style: normal; font-weight: 700; }

  /* ---------- révélation d'une question ---------- */

  .question .qtxt { display: block; }

  /* la bulle arrive… */
  .question.reveal { animation: qPop .42s var(--qdelay, 0ms) cubic-bezier(.16,1.18,.3,1) both; }

  @keyframes qPop {
    from { opacity: 0; transform: translateY(16px) scale(.94) rotate(-1.4deg); }
    to   { opacity: 1; transform: none; }
  }

  /* …puis le texte se dévoile de gauche à droite */
  .question.reveal .qtxt {
    animation: qWipe .46s calc(var(--qdelay, 0ms) + .24s) cubic-bezier(.35,0,.15,1) both;
  }

  @keyframes qWipe {
    from { clip-path: inset(0 100% -18% 0); opacity: .25; }
    to   { clip-path: inset(0 -6% -18% 0); opacity: 1; }
  }

  /* ---------- faux départ : barré puis détruit ---------- */

  .question.is-gag { position: relative; }

  /* le trait qui raye, tracé de gauche à droite */
  .question .strike {
    position: absolute;
    left: 5%; right: 5%;
    top: 52%;
    height: 7px;
    border-radius: 4px;
    background: var(--rose);
    box-shadow: 0 0 0 2px var(--ink);
    transform: scaleX(0) rotate(-.6deg);
    transform-origin: left center;
    opacity: 0;
    pointer-events: none;
  }
  .question.gag-raye .strike {
    animation: strikeIn .5s cubic-bezier(.3,.85,.3,1) forwards;
  }

  @keyframes strikeIn {
    from { transform: scaleX(0) rotate(-.6deg); opacity: 1; }
    to   { transform: scaleX(1) rotate(-.6deg); opacity: 1; }
  }

  /* le texte se disloque et tombe, le trait part avec lui */
  .question.gag-casse .qtxt { animation: qShred .6s cubic-bezier(.4,0,.7,1) forwards; }
  .question.gag-casse .strike { animation: qShredLine .6s cubic-bezier(.4,0,.7,1) forwards; }
  .question.gag-casse { animation: qShake .6s ease both; }

  @keyframes qShred {
    0%   { opacity: 1; transform: none; filter: none; }
    22%  { opacity: 1; transform: translateY(-5px) rotate(-1deg); }
    100% { opacity: 0; transform: translateY(30px) rotate(2.5deg) scale(.93); filter: blur(7px); }
  }

  @keyframes qShredLine {
    0%   { opacity: 1; transform: scaleX(1) rotate(-.6deg); }
    100% { opacity: 0; transform: scaleX(1) translateY(26px) rotate(4deg); }
  }

  @keyframes qShake {
    0%, 100% { transform: none; }
    15%  { transform: translateX(-6px) rotate(-.7deg); }
    35%  { transform: translateX(6px) rotate(.7deg); }
    55%  { transform: translateX(-4px); }
    75%  { transform: translateX(3px); }
  }

  /* ---------- QCM ---------- */

  .options { display: flex; flex-direction: column; gap: 13px; max-width: 74ch; }

  .option {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px;
    align-items: center;
    padding: 13px 20px;
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: var(--cutout-sm);
    font-size: clamp(15px, 1.25vw, 21px);
    line-height: 1.45;
  }

  .option .letter {
    font-family: var(--display);
    font-weight: 400;
    font-size: 1.5em;
    width: 1.6em; height: 1.6em;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--rose);
    border: 3px solid var(--ink);
    color: #fff;
    line-height: 1;
    padding-top: .12em;
  }

  /* arrivée d'une option révélée */
  @keyframes optPop {
    0%   { opacity: 0; transform: translateX(-26px) scale(.95); }
    62%  { opacity: 1; transform: translateX(5px) scale(1.015); }
    100% { opacity: 1; transform: none; }
  }
  .option.pop { animation: optPop .38s cubic-bezier(.2,.9,.3,1.12) both; }

  @keyframes letterPop {
    0%   { transform: scale(.25) rotate(-45deg); }
    68%  { transform: scale(1.18) rotate(8deg); }
    100% { transform: none; }
  }
  .option.pop .letter { animation: letterPop .46s .05s cubic-bezier(.2,.9,.3,1.2) both; }

  .hidden-note {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--raised);
    border: 3px dashed var(--ink);
    border-radius: 14px;
    padding: 20px 24px;
    font-size: clamp(13px, 1.1vw, 18px);
    max-width: 60ch;
  }

  /* ---------- chrono ---------- */

  .timerwrap { display: flex; align-items: center; gap: 20px; }

  .ring { width: 74px; height: 74px; flex: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .track { stroke: rgba(20,9,15,.16); }
  .ring .bar {
    stroke: var(--amber);
    stroke-linecap: butt;
    transition: stroke-dashoffset .25s linear, stroke .3s;
  }
  .ring.urgent .bar { stroke: var(--rose); }

  .count {
    font-family: var(--display);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 4vw, 66px);
    line-height: 1;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .count.urgent { color: var(--rose); }
  .count.done { color: var(--miss); }

  /* ---------- pastilles de duo ---------- */

  .scorerow { display: flex; flex-wrap: wrap; gap: 12px; }

  .chip {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(16px, 1.35vw, 24px);
    letter-spacing: .05em;
    padding: clamp(7px, 1.2vh, 11px) clamp(14px, 1.4vw, 20px);
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: var(--cutout-sm);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 11px;
    transition: transform .1s, box-shadow .1s, background .14s;
  }

  .chip:hover { transform: translateY(-3px); box-shadow: 0 0 0 5px #fff, 0 12px 22px rgba(20,50,90,.28); }
  .chip:active { transform: translateY(1px); box-shadow: 0 0 0 5px #fff, 0 3px 8px rgba(20,50,90,.22); }
  .chip:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  .chip .mark {
    width: 22px; height: 22px;
    border: 3px solid var(--ink);
    background: var(--raised);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 13px;
    line-height: 1;
    color: var(--ink);
  }

  /* matché : le duo passe en jaune criard, la coche en rose */
  .chip.on { background: var(--yellow); }
  .chip.on .mark { background: var(--rose); color: #fff; }

  /* cœurs de vie de la finale */
  .hprow { margin-left: 8px; letter-spacing: 2px; white-space: nowrap; }
  .hp { color: var(--rose); }
  .hp.lost { color: rgba(18,16,15,.22); }

  /* un duo qui vient de rater cette question */
  .chip.win { background: #0B8A46; color: #fff; }
  .chip.win .mark { background: #fff; }

  .chip.fail { background: var(--rose); color: #fff; }
  .chip.fail .mark { background: #fff; color: var(--rose); }
  .chip.fail .hp { color: #fff; }
  .chip.fail .hp.lost { color: rgba(255,255,255,.35); }

  .chip.out {
    opacity: .45;
    pointer-events: none;
    text-decoration: line-through;
    box-shadow: none;
    background: var(--ground-2);
  }

  /* la cible : surlignée au marqueur */
  .target {
    font-weight: 900;
    background: linear-gradient(
      transparent 56%, var(--yellow) 56%, var(--yellow) 94%, transparent 94%);
    padding: 0 .1em;
  }
  .other { opacity: .5; }
  .amp { opacity: .35; margin: 0 3px; }
  .chip.on .target {
    background: none;
    border-bottom: 3px solid var(--ink);
  }

  /* ---------- boutons ---------- */

  .btn {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(14px, 1.15vw, 19px);
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 11px 22px;
    background: var(--raised);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: var(--cutout-sm);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s, background .14s;
  }

  .btn:hover { transform: translateY(-3px); box-shadow: 0 0 0 5px #fff, 0 12px 22px rgba(20,50,90,.28); }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 0 5px #fff, 0 3px 8px rgba(20,50,90,.22); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  .btn.primary { background: var(--rose); color: #fff; }
  .btn.primary:hover { background: #ff5087; }
  .btn.ghost { background: rgba(255,255,255,.75); }
  .btn.ghost:hover { background: var(--raised); }
  .btn:disabled {
    opacity: .38;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
    background: var(--ground-2);
  }

  kbd {
    font-family: var(--data);
    font-size: .78em;
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--ink);
    margin-left: 9px;
  }

  /* ---------- panneau des scores ---------- */

  .panel {
    position: fixed;
    inset: 0 0 0 auto;
    width: min(460px, 92vw);
    background: var(--ground);
    border-left: 5px solid var(--ink);
    z-index: 20;
    padding: var(--pad);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow: -14px 0 0 rgba(20,9,15,.12);
  }
  .panel.open { transform: none; }

  .panel h2 {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .panel h2::before { content: "♥ "; color: var(--rose); }

  table { width: 100%; border-collapse: collapse; margin-bottom: 26px; }

  th, td {
    text-align: left;
    padding: 9px 6px;
    border-bottom: 2px solid rgba(20,9,15,.18);
    font-size: 16px;
  }

  th {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--muted);
  }

  td.num {
    font-family: var(--display);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-size: 20px;
    color: var(--rose-dim);
  }

  tr.gone td { color: var(--miss); }
  tr.gone td.num { color: var(--miss); }

  .cible {
    font-family: var(--data);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--ink);
    background: var(--raised);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .cible:hover { background: var(--yellow); }

  /* ---------- classements ---------- */

  /* liste de reprise en Manche 3 : un duo, deux rôles possibles */
  .picklist { display: flex; flex-direction: column; gap: clamp(6px, 1vh, 10px); max-width: 780px; }

  .pickrow {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: clamp(6px, 1vh, 10px) clamp(12px, 1.3vw, 18px);
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: var(--cutout-sm);
  }
  .pickrow.isfin  { background: #E8F7EE; }
  .pickrow.isjury { background: #FFF3D2; }

  .pickrow .pickname {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .04em;
    font-size: clamp(16px, min(1.5vw, 2.4vh), 25px);
  }
  .pickrow .btn { font-size: clamp(11px, min(.95vw, 1.5vh), 15px); padding: 7px 13px; }

  .ranks { display: flex; flex-direction: column; gap: clamp(7px, 1.1vh, 11px); max-width: 780px; }

  .rank {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: clamp(9px, 1.3vh, 13px) 18px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: var(--raised);
    box-shadow: var(--cutout-sm);
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(17px, min(1.55vw, 2.6vh), 27px);
    letter-spacing: .04em;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s, background .14s;
  }
  .rank:hover { transform: translateY(-3px); box-shadow: 0 0 0 5px #fff, 0 12px 22px rgba(20,50,90,.28); }
  .rank:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .rank .pos { font-family: var(--display); color: var(--muted); font-size: .9em; }
  .rank .pts { font-family: var(--display); color: var(--rose-dim); font-variant-numeric: tabular-nums; }
  .rank.picked { background: var(--rose); color: #fff; }
  .rank.picked .pos, .rank.picked .pts { color: #fff; }
  .rank.picked .pos::after { content: " ✕"; }
  .rank.picked.qualif { background: #0B8A46; }
  .rank.tie { border-left: 10px solid var(--yellow); }

  /* ---------- titres criards ---------- */

  .winner {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(46px, 7.4vw, 132px);
    line-height: .98;
    letter-spacing: .01em;
    color: var(--yellow);
    -webkit-text-stroke: 5px var(--ink);
    paint-order: stroke fill;
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 12px 20px rgba(20,50,90,.3));
    text-wrap: balance;
    margin: 0;
  }

  .title-h1 {
    margin: 0;
    line-height: .88;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .title-h1 .t-z {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(52px, 9vw, 168px);
    letter-spacing: .01em;
    color: var(--raised);
    -webkit-text-stroke: 5px var(--ink);
    paint-order: stroke fill;
    filter: drop-shadow(0 0 7px #fff) drop-shadow(0 10px 18px rgba(20,50,90,.3));
  }
  .title-h1 .t-go {
    font-family: var(--script);
    font-size: clamp(46px, 7.6vw, 140px);
    color: var(--yellow);
    -webkit-text-stroke: 4px var(--ink);
    paint-order: stroke fill;
    margin-top: -.12em;
    margin-left: .9em;
    filter: drop-shadow(0 0 7px #fff) drop-shadow(0 10px 18px rgba(20,50,90,.3));
  }

  .warn {
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 13px 18px;
    background: var(--yellow);
    box-shadow: var(--cutout-sm);
    font-size: clamp(14px, 1.15vw, 19px);
    font-weight: 600;
    max-width: 68ch;
    line-height: 1.5;
  }

  /* ---------- éditeur de pack ---------- */

  .editor {
    width: 100%;
    max-width: 980px;
    font-size: 15px;
    text-align: left;
  }

  .ed-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .ed-tab {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-size: 14px;
    padding: 8px 15px;
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: var(--cutout-sm);
    cursor: pointer;
    color: var(--ink);
  }
  .ed-tab.on { background: var(--yellow); }
  .ed-count {
    font-family: var(--data);
    font-size: 11px;
    background: rgba(18,16,15,.1);
    border-radius: 999px;
    padding: 1px 7px;
    margin-left: 5px;
  }

  .ed-status {
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: var(--raised);
    padding: 9px 14px;
    margin-bottom: 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .ed-status .ok { color: #0B8A46; font-weight: 800; }
  .ed-status .ko { color: var(--rose-dim); font-weight: 800; }

  /* message passager, sur les écrans qui n'ont pas de zone prévue pour */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    z-index: 60;
    max-width: min(720px, 90vw);
    padding: 10px 16px;
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: var(--cutout-sm);
    font-size: 14px;
  }

  .ed-card {
    background: var(--raised);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 13px 15px;
    margin-bottom: 11px;
    box-shadow: var(--cutout-sm);
  }
  .ed-card.compact { padding: 9px 13px; }

  .ed-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .ed-head strong { font-family: var(--display); font-weight: 400; letter-spacing: .04em; font-size: 18px; }
  .ed-head .ed-count { margin-left: 0; }
  .ed-head > :nth-child(2) { margin-left: auto; }

  .ed-sub {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--muted);
    margin: 13px 0 7px;
  }

  .ed-f { display: block; margin-bottom: 8px; }
  .ed-f > span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 3px;
    letter-spacing: .02em;
  }
  .ed-f input, .ed-f textarea, .ed-f select {
    width: 100%;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: #FBFDFF;
    border: 2px solid rgba(18,16,15,.35);
    border-radius: 8px;
    padding: 7px 10px;
    box-sizing: border-box;
  }
  .ed-f textarea { resize: vertical; line-height: 1.4; }
  .ed-f input:focus, .ed-f textarea:focus, .ed-f select:focus {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(30,86,160,.18);
  }

  .ed-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .ed-check { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; line-height: 1.4; }
  .ed-check input { margin-top: 2px; width: 17px; height: 17px; }

  .ed-opts { margin: 9px 0 4px; }
  .ed-lbl {
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .ed-opt { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .ed-opt input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    background: #FBFDFF;
    border: 2px solid rgba(18,16,15,.35);
    border-radius: 8px;
    padding: 6px 9px;
  }
  .ed-letter {
    font-family: var(--display);
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--rose);
    color: #fff;
    border: 2px solid var(--ink);
    font-size: 14px;
    flex: none;
  }

  .ed-x {
    font: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 5px 9px;
    background: var(--raised);
    border: 2px solid var(--ink);
    border-radius: 7px;
    cursor: pointer;
    color: var(--ink);
  }
  .ed-x:hover { background: var(--ground-2); }
  .ed-x:disabled { opacity: .3; cursor: not-allowed; }
  .ed-x.danger:hover, .ed-x.danger.arme { background: var(--rose); color: #fff; }
  .ed-ord { display: inline-flex; gap: 4px; }

  .ed-add {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    background: var(--ground-2);
    border: 2px dashed var(--ink);
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .ed-add:hover { background: var(--yellow); }
  .ed-add.gros { display: block; width: 100%; padding: 11px; margin: 4px 0 26px; font-size: 14.5px; }

  .ed-det { margin-top: 8px; }
  .ed-det summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .ed-hint {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 4px 0 12px;
  }

  /* dans l'éditeur, la scène défile au lieu de centrer */
  .stage:has(.editor) {
    justify-content: flex-start;
    padding-top: 18px;
    padding-bottom: 18px;
  }

  /* ---------- panneaux « comment on joue » ---------- */

  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.6vw, 26px);
    max-width: 1240px;
  }

  .step {
    position: relative;
    background: var(--raised);
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: var(--cutout-sm);
    padding: clamp(14px, 1.8vh, 24px) clamp(14px, 1.4vw, 22px) clamp(12px, 1.5vh, 20px);
    text-align: center;
  }

  .step .stepnum {
    position: absolute;
    top: -19px; left: -13px;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--rose);
    color: #fff;
    border: 4px solid var(--ink);
    box-shadow: 0 0 0 4px #fff;
    font-family: var(--display);
    font-size: 23px;
    padding-top: 2px;
  }

  .step .ic {
    display: block;
    width: clamp(72px, min(7vw, 11vh), 116px);
    height: auto;
    margin: 0 auto clamp(6px, 1vh, 12px);
    fill: none;
    stroke: var(--ink);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .step .ic .fillw { fill: var(--raised); }
  .step .ic .acc { fill: var(--yellow); }
  .step .ic .acc-f { fill: var(--rose); }
  .step .ic .ic-t {
    font-family: var(--display);
    font-size: 42px;
    fill: var(--ink);
    stroke: none;
    text-anchor: middle;
  }

  .step h3 {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .05em;
    text-transform: uppercase;
    font-size: clamp(15px, min(1.4vw, 2.2vh), 24px);
    margin: 0 0 6px;
    color: var(--rose-dim);
  }

  .step p {
    margin: 0;
    font-size: clamp(13px, min(1.05vw, 1.7vh), 18px);
    line-height: 1.45;
    color: var(--ink);
  }
  .step p b { color: var(--amber); }

  .stage:has(.ranks) { gap: clamp(10px, 1.5vh, 22px); }
  .stage:has(.ranks) .warn { padding: 10px 16px; }

  .cats { display: flex; flex-wrap: wrap; gap: 11px; }
  .cats .btn { padding: 9px 17px; }
  .stage:has(.cats) .question { font-size: clamp(24px, min(3.2vw, 5vh), 48px); margin-bottom: 28px; }

  /* ---------- annonce de duo (Manche 2) ---------- */

  .announce {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    pointer-events: none;
    overflow: hidden;
    background: linear-gradient(#F0433C, #C3141A);
    animation: annFade 1.8s cubic-bezier(.4,0,.2,1) forwards;
  }

  /* trame de cœurs qui gonflent au passage de la vague */
  .ann-hearts {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  @keyframes annFade {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    76%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* bande de vitesse qui traverse l'écran */
  .announce .ann-sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 45vw;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: annSweep 1.15s cubic-bezier(.5,0,.2,1) forwards;
  }

  @keyframes annSweep {
    from { transform: translateX(-60vw) skewX(-14deg); }
    to   { transform: translateX(120vw) skewX(-14deg); }
  }

  .announce .ann-inner {
    position: relative;
    text-align: center;
    padding: 0 var(--pad);
  }

  .announce .ann-lead {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .2em;
    text-transform: uppercase;
    font-size: clamp(14px, 1.5vw, 23px);
    color: #fff;
    margin-bottom: 18px;
    animation: annLead .55s .12s cubic-bezier(.2,.7,.3,1) both;
  }
  .announce .ann-lead::before { content: "♥ "; }
  .announce .ann-lead::after  { content: " ♥"; }

  @keyframes annLead {
    from { opacity: 0; transform: translateY(14px); letter-spacing: .5em; }
    to   { opacity: 1; transform: none; letter-spacing: .2em; }
  }

  /* le nom du duo dans une bulle blanche */
  .announce .ann-who {
    display: inline-block;
    font-family: var(--heavy);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 84px);
    line-height: 1.06;
    text-wrap: balance;
    color: var(--ink);
    background: var(--raised);
    border: 5px solid var(--ink);
    border-radius: 34px;
    padding: 16px clamp(22px, 3vw, 46px);
    box-shadow: var(--cutout);
    animation: annWho .7s .2s cubic-bezier(.16,1.1,.3,1) both;
  }

  @keyframes annWho {
    from { opacity: 0; transform: translateY(30px) scale(.9) rotate(-3deg); }
    to   { opacity: 1; transform: none; }
  }

  .announce .ann-bar {
    height: 6px;
    margin: 26px auto 18px;
    max-width: 320px;
    background: var(--yellow);
    border: 3px solid var(--ink);
    box-shadow: 0 0 0 4px #fff;
    transform-origin: center;
    animation: annBar .6s .42s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes annBar {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  .announce .ann-step {
    display: inline-block;
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: clamp(14px, 1.5vw, 24px);
    color: var(--ink);
    background: var(--yellow);
    border: 3px solid var(--ink);
    box-shadow: var(--cutout-sm);
    padding: 5px 16px;
    transform: rotate(-1.5deg);
    animation: annStep .5s .6s ease both;
  }

  @keyframes annStep {
    from { opacity: 0; transform: translateY(10px) rotate(-1.5deg); }
    to   { opacity: 1; transform: rotate(-1.5deg); }
  }

  /* la question réapparaît en fondu derrière l'annonce qui s'efface */
  .stage.enter { animation: stageIn .65s .95s cubic-bezier(.2,.7,.3,1) both; }

  @keyframes stageIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- destruction d'un cœur (Manche 3) ---------- */

  /* ---------- célébration du vainqueur ---------- */

  .victory {
    position: fixed;
    inset: 0;
    z-index: 48;
    display: grid;
    place-items: center;
    pointer-events: none;
    overflow: hidden;
    background: linear-gradient(#FFFFFF 0%, #DDEEFC 55%, #B9D9F5 100%);
    animation: vcFade 4.2s ease forwards;
  }

  @keyframes vcFade {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    88%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .victory .vc-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .victory .vc-inner { position: relative; text-align: center; padding: 0 var(--pad); }

  .victory .vc-word {
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-size: clamp(38px, min(6.5vw, 10vh), 104px);
    line-height: 1;
    color: var(--yellow);
    -webkit-text-stroke: 5px var(--ink);
    paint-order: stroke fill;
    transform: rotate(-3deg);
    animation: vcWord .5s cubic-bezier(.16,1.25,.3,1) both;
  }

  @keyframes vcWord {
    from { opacity: 0; transform: rotate(-3deg) scale(.2); }
    65%  { opacity: 1; transform: rotate(-3deg) scale(1.2); }
    to   { opacity: 1; transform: rotate(-3deg) scale(1); }
  }

  .victory .vc-name {
    display: inline-block;
    margin-top: clamp(12px, 2.4vh, 30px);
    font-family: var(--heavy);
    font-weight: 400;
    font-size: clamp(26px, min(4.4vw, 6.6vh), 76px);
    line-height: 1.08;
    text-wrap: balance;
    color: var(--ink);
    background: var(--raised);
    border: 5px solid var(--ink);
    border-radius: 30px;
    padding: clamp(10px, 1.8vh, 20px) clamp(20px, 3vw, 48px);
    box-shadow: var(--cutout);
    animation: vcName .65s .3s cubic-bezier(.16,1.1,.3,1) both;
  }

  @keyframes vcName {
    from { opacity: 0; transform: translateY(34px) scale(.9) rotate(2deg); }
    to   { opacity: 1; transform: none; }
  }

  .victory .vc-sub {
    margin-top: clamp(12px, 2vh, 22px);
    font-size: clamp(20px, min(2.2vw, 3.4vh), 38px);
    letter-spacing: 3px;
    animation: vcSub .5s .62s ease both;
  }
  .victory .vc-cnt {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: clamp(12px, min(1.2vw, 1.9vh), 19px);
    color: var(--muted);
    margin-left: 10px;
    vertical-align: middle;
  }

  @keyframes vcSub {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .hbreak {
    position: fixed;
    inset: 0;
    z-index: 47;
    display: grid;
    place-items: center;
    pointer-events: none;
    overflow: hidden;
    background: radial-gradient(70% 70% at 50% 45%, #3A0A16, #14060B 80%);
    animation: hbFade 1.7s ease forwards;
  }

  @keyframes hbFade {
    0%   { opacity: 0; }
    7%   { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .hbreak .hb-inner { text-align: center; padding: 0 var(--pad); }

  /* l'onomatopée, en gros et de travers */
  .hbreak .hb-word {
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-size: clamp(40px, min(7vw, 11vh), 108px);
    line-height: 1;
    color: var(--yellow);
    -webkit-text-stroke: 5px var(--ink);
    paint-order: stroke fill;
    filter: drop-shadow(0 0 8px rgba(255,212,0,.45));
    transform: rotate(-4deg);
    animation: hbWord .4s cubic-bezier(.16,1.2,.3,1) both;
    margin-bottom: clamp(10px, 2vh, 26px);
  }

  @keyframes hbWord {
    from { opacity: 0; transform: rotate(-4deg) scale(.3); }
    60%  { opacity: 1; transform: rotate(-4deg) scale(1.18); }
    to   { opacity: 1; transform: rotate(-4deg) scale(1); }
  }

  .hbreak .hb-duos {
    display: flex;
    justify-content: center;
    gap: clamp(28px, 5vw, 80px);
    flex-wrap: wrap;
  }

  /* le cœur : deux moitiés dentelées qui se séparent */
  .hbreak .hb-shatter {
    position: relative;
    width: clamp(90px, min(11vw, 17vh), 170px);
    height: clamp(83px, min(10.1vw, 15.6vh), 156px);
    margin: 0 auto clamp(8px, 1.4vh, 16px);
    animation: hbShake .3s .05s ease-in-out both;
  }

  @keyframes hbShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20%  { transform: translateX(-7px) rotate(-4deg); }
    45%  { transform: translateX(7px) rotate(4deg); }
    70%  { transform: translateX(-5px) rotate(-3deg); }
  }

  .hbreak .hb-shatter svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }
  .hbreak .hb-shatter path {
    fill: var(--rose);
    stroke: var(--ink);
    stroke-width: 4;
    stroke-linejoin: round;
  }

  /* la cassure est en zigzag, pas une coupe nette */
  .hbreak .hb-l {
    clip-path: polygon(0 0, 54% 0, 44% 22%, 56% 40%, 43% 58%, 53% 78%, 46% 100%, 0 100%);
    animation: hbLeft .75s .34s cubic-bezier(.3,.1,.5,1) both;
  }
  .hbreak .hb-r {
    clip-path: polygon(54% 0, 100% 0, 100% 100%, 46% 100%, 53% 78%, 43% 58%, 56% 40%, 44% 22%);
    animation: hbRight .75s .34s cubic-bezier(.3,.1,.5,1) both;
  }

  @keyframes hbLeft {
    from { transform: none; opacity: 1; }

   jeu original, sans les duos de juillet 2026 ni leurs Jokers, écrits pour eux. */

/* ===================== PACK ACTIF ET VUES DÉRIVÉES =====================
   Le pack est la SEULE source de vérité : chaque question y porte ses
   propres options de QCM, ce qui rend impossible le décalage silencieux
   qu'on avait avec une table d'options indexée à part.
   Le moteur d'écrans lit les vues ci-dessous, reconstruites à chaque
   changement de pack. ===================================================== */

const PACK_KEY = "zamours-pack-v1";

let PACK, DUOS, M1, M3, M2_TOURS, M2_CATS, M2_POINTS, M3_LIVES, CHRONO;

function appliquerPack(pk) {
  PACK = pk;
  DUOS = PACK.duos;
  M1   = PACK.manche1;
  M3   = PACK.manche3.map(x => x.q);
  const r = PACK.reglages || {};
  M2_TOURS  = Math.max(1, r.m2Tours || 3);
  M2_CATS   = M2_TOURS - 1;
  M2_POINTS = 3 + M2_CATS * 2;
  M3_LIVES  = Math.max(1, r.m3Coeurs || 3);
  CHRONO    = Math.max(5, r.chrono || 20);
  // un chrono modifié dans l'éditeur doit se voir tout de suite en jeu
  if (typeof S !== "undefined" && S && !S.tRunning) S.tLeft = CHRONO;
  document.title = (PACK.meta.nom || "Partie") + " — Pupitre";
}

// Titre en deux lignes : le sous-titre passe dessous, en script jaune.
// Un pack peut porter le sous-titre à la fin du nom (« Z'amours and Go » +
// « and Go ») : on ne l'affiche alors qu'une fois.
function titreParts() {
  const nom = PACK.meta.nom || "", sous = PACK.meta.sousTitre || "";
  const haut = sous && nom.endsWith(sous) ? nom.slice(0, -sous.length).trim() : nom;
  return [haut || "Ma partie", sous];
}

const aDesOptions = o => !!(o && o.length);

function categorieParId(id) { return PACK.categories.find(c => c.id === id); }
function jokerDe(duo) { return (duo && duo.joker) || { gag: "", q: "", opts: [] }; }
function m2StepLabel(k) { return k === 0 ? "Joker" : "Catégorie " + k + "/" + M2_CATS; }

      if (pk && pk.version) { appliquerPack(normaliserPack(pk)); return true; }
    }
  } catch (e) {}
  return false;
}

function sauverPack() {
  try { localStorage.setItem(PACK_KEY, JSON.stringify(PACK)); return true; }
  catch (e) { return false; }
}

}

/* --- où la partie est enregistrée ---
   Le navigateur garde la partie, mais un navigateur se vide et un PC se
   change : seul un fichier .json la conserve vraiment. On retient donc le
   dernier fichier ouvert ou enregistré, et si la partie a changé depuis.

   « (1) », « (2) »… à chaque fois) ; réécrire le même fichier demanderait

const FICHIER_KEY = "zamours-fichier-v1";
let FICHIER = { nom: null, comment: null, quand: null, modifie: true };

function lireFichier() {
  try { Object.assign(FICHIER, JSON.parse(localStorage.getItem(FICHIER_KEY)) || {}); } catch (e) {}
}

function noterFichier(maj) {
  Object.assign(FICHIER, maj);
  try { localStorage.setItem(FICHIER_KEY, JSON.stringify(FICHIER)); } catch (e) {}
}

// appelée par l'éditeur à chaque vraie modification (pas en changeant d'onglet)
function marquerModifie() {
  if (!FICHIER.modifie) noterFichier({ modifie: true });
  rafraichirSauvegarde();
}

function etatSauvegarde() {
  if (FICHIER.modifie) {
    return `<span class="ko">⚠ Modifications pas encore enregistrées dans un fichier.</span>
      Clique sur « 💾 Enregistrer » pour ne rien perdre${FICHIER.nom ? ` (dernier fichier : « ${esc(FICHIER.nom)} »)` : ""}.`;
  }
  if (FICHIER.comment === "ouverte") return `<span class="ok">✓ Ouverte depuis « ${esc(FICHIER.nom)} »</span>, aucune modification depuis.`;
  if (FICHIER.comment === "enregistree") {
    const quand = new Date(FICHIER.quand).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    return `<span class="ok">✓ Enregistrée</span> dans tes Téléchargements, sous « ${esc(FICHIER.nom)} » (le ${quand}).`;
  }
  return "Partie de départ, pas encore modifiée.";
}

function rafraichirSauvegarde() {
  document.querySelectorAll(".etat-sauvegarde").forEach(n => n.innerHTML = etatSauvegarde());
}

// Fermer l'onglet sur des modifications jamais enregistrées : le navigateur demande confirmation.
window.addEventListener("beforeunload", e => {
  if (FICHIER.modifie && packSauve()) { e.preventDefault(); e.returnValue = ""; }
});

/* Remplit les champs manquants : un pack importé peut venir d'une autre
   version ou avoir été écrit à la main. */
function normaliserPack(pk) {
  const q = o => ({
    q: String(o && o.q || ""),
    opts: Array.isArray(o && o.opts) ? o.opts.filter(x => String(x || "").trim()).map(String) : [],
    note: String(o && o.note || ""),
    sponsor: (o && o.sponsor && o.sponsor.by) ? { by: String(o.sponsor.by), fine: String(o.sponsor.fine || "") } : null
  });
  // Les ids finissent dans des attributs HTML : un pack reçu d'un tiers ne
  // doit pas pouvoir y glisser de guillemet. On les réduit à [a-z0-9-], uniques.
  const vus = new Set();
  const idSur = (brut, defaut) => {
    let id = String(brut || "").toLowerCase().replace(/[^a-z0-9-]/g, "") || defaut;
    while (vus.has(id)) id += "x";
    vus.add(id);
    return id;
  };
  return {
    version: pk.version || 1,
    meta: Object.assign({ nom: "Ma partie", sousTitre: "", auteur: "" }, pk.meta || {}),
    reglages: Object.assign({ m2Tours: 3, m3Coeurs: 3, chrono: 20 }, pk.reglages || {}),
    duos: (pk.duos || []).map((d, i) => ({
      id: idSur(d.id, "d" + i), a: String(d.a || ""), b: String(d.b || ""),
      joker: Object.assign({ gag: "", q: "", opts: [] }, q(d.joker || {}), { gag: String((d.joker || {}).gag || "") })
    })),
    manche1: (pk.manche1 || []).map(x => Object.assign(q(x), {
      type: x.type === "spotlight" ? "spotlight" : "eclair",
      pts: Number(x.pts) > 0 ? Number(x.pts) : 1
    })),
    categories: (pk.categories || []).map((c, i) => ({
      id: idSur(c.id, "c" + i), label: String(c.label || "Catégorie"),
      questions: (c.questions || []).map(q)
    })),
    manche3: (pk.manche3 || []).map(q)
  };
}

/* --- validation : empêche de lancer une partie incohérente --- */

function validerPack(pk) {
  const e = [];
  // 2 duos sortent en Manche 1 et 2 vont en finale : en dessous de 4, l'entonnoir est vide
  if (pk.duos.length < 4) e.push("Il faut au moins 4 duos : 2 sortent en Manche 1, 2 vont en finale.");
  pk.duos.forEach(d => {
    if (!d.a.trim() || !d.b.trim()) e.push("Un duo n'a pas ses deux prénoms.");
    if (!d.joker.q.trim()) e.push(`${d.a} & ${d.b} n'a pas de question Joker.`);
  });
  if (!pk.manche1.length) e.push("La Manche 1 n'a aucune question.");
  const cats = pk.categories.filter(c => c.questions.length);
  if (cats.length < 1) e.push("Il faut au moins une catégorie avec des questions.");
  const besoin = Math.max(0, pk.duos.length - 2) * (Math.max(1, pk.reglages.m2Tours) - 1);
  const dispo = cats.reduce((t, c) => t + c.questions.length, 0);
  if (besoin > dispo) e.push(`Manche 2 : ${besoin} questions seront tirées mais la banque n'en contient que ${dispo}.`);
  if (!pk.manche3.length) e.push("La Manche 3 n'a aucune consigne.");

  // QCM : une option vide s'afficherait vide à l'écran, une seule option n'est pas un choix
  const qcm = (o, ou) => {
    if (!o.opts.length) return;
    if (o.opts.length < 2) e.push(`${ou} : un QCM a besoin d'au moins 2 options.`);
    if (o.opts.some(x => !String(x).trim())) e.push(`${ou} : une option de QCM est vide.`);
  };
  pk.duos.forEach(d => qcm(d.joker, `Joker de ${d.a} & ${d.b}`));
  pk.manche1.forEach((q, i) => qcm(q, `Manche 1, question ${i + 1}`));
  pk.categories.forEach(c => c.questions.forEach((q, i) => qcm(q, `${c.label}, question ${i + 1}`)));
  return e;
}

const duoName = d => d.a + " & " + d.b;
const byId = id => DUOS.find(d => d.id === id);

// Cible = celui qui écrit la vraie réponse. Tirée au sort au départ,
// puis alternée automatiquement à chaque question (i = index de question).
function cibleSide(d, i) {
  const base = (S.cible && S.cible[d.id]) === "b" ? 1 : 0;
  return (base + (i || 0)) % 2 === 0 ? "a" : "b";
}

function cibleName(d, i) { return cibleSide(d, i) === "a" ? d.a : d.b; }
function devineurName(d, i) { return cibleSide(d, i) === "a" ? d.b : d.a; }

// « … » désigne la cible. En Manche 2 un seul duo joue : on écrit son prénom
// en toutes lettres. En Manche 1 tous les duos ont chacun leur cible, on garde
// le repère mais on le surligne comme le prénom dans la pastille, pour que le
// lien soit visuel et non à deviner.
// Trois points tapés au clavier (« ... ») valent « … » : ce caractère-là ne se
// tape pas sur un clavier Windows.
function qText(t, name) {
  const marque = name ? esc(name) : "…";
  return esc(t).split(/\.\.\.|…/).join(`<span class="ph">${marque}</span>`);
}

// bandeau des rôles, affiché juste sous la question
function rolesBand(d, i, qcm) {
  // sur un QCM il n'y a pas de rôles à départager, et la règle est déjà
  // portée par l'étiquette en haut et par la ligne d'attribution en bas
  if (qcm) return "";
  if (!d) return `<div class="roles"><span class="ph">Le prénom surligné</span> écrit <b>sa</b> vraie réponse sur l'ardoise · l'autre doit deviner ce qui y est écrit</div>`;
  return `<div class="roles"><b>${esc(cibleName(d, i))}</b> écrit <b>sa</b> vraie réponse sur l'ardoise · `
       + `<b>${esc(devineurName(d, i))}</b> doit deviner ce qui y est écrit</div>`;
}

// Nom du duo avec la cible mise en avant
function duoNameCible(d, i) {
  const t = cibleSide(d, i);
  const a = `<span class="${t === "a" ? "target" : "other"}">${esc(d.a)}</span>`;
  const b = `<span class="${t === "b" ? "target" : "other"}">${esc(d.b)}</span>`;
  return `${a} <span class="amp">&amp;</span> ${b}`;
}

const KEY = "zamours-console-v4";
let S;

// Remet un état chargé en cohérence avec la liste de duos ACTUELLE.
// Sans ça, une partie sauvegardée qui cite un duo retiré du fichier fait
// planter le rendu au chargement (m2duo() renvoie undefined).
function hydrate(st) {
  const ids = new Set(DUOS.map(d => d.id));
  st.eliminated = (st.eliminated || []).filter(i => ids.has(i));
  st.m2order    = (st.m2order    || []).filter(i => ids.has(i));
  st.finalists  = (st.finalists  || []).filter(i => ids.has(i));

  st.cible = st.cible || {};
  DUOS.forEach(d => {
    if (st.cible[d.id] !== "a" && st.cible[d.id] !== "b") st.cible[d.id] = Math.random() < .5 ? "a" : "b";
  });

  st.m2i   = Math.max(0, Math.min(st.m2i   || 0, st.m2order.length - 1));
  st.m1i   = Math.max(0, Math.min(st.m1i   || 0, M1.length - 1));
  st.m2step = Math.max(0, Math.min(st.m2step || 0, M2_TOURS - 1));

  // un écran devenu impossible : on revient au titre plutôt que de planter
  if (st.screen === "m2"  && st.m2order.length === 0)  st.screen = "title";
  if (st.screen === "m3"  && st.finalists.length !== 2) st.screen = "title";
  if (!SCREENS[st.screen]) st.screen = "title";
  return st;
}

function freshState() {
  const c = {};
  DUOS.forEach(d => c[d.id] = Math.random() < .5 ? "a" : "b");
  return {
    screen: "title",
    cible: c,
    m1i: 0, m1marks: {},
    eliminated: [],
    m2order: [], m2i: 0, m2step: 0, m2cat: {}, m2drawn: {}, m2used: {}, m2marks: {},
    finalists: [], m3i: 0, m3marks: {},
    sudden: false, suddenWinner: null,
    resumed: false,
    revealCount: 0,
    tStart: null, tLeft: CHRONO, tRunning: false,
    panel: false
  };
}

let AUTOTEST = false;   // l'auto-test joue une partie : il ne doit pas écraser la vraie

function save() {
  if (AUTOTEST) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* Les scores ne sont jamais stockés : on les recalcule depuis les cases
   cochées. Un compteur tenu à côté des cases finit toujours par diverger
   (un aller-retour entre manches, un barème changé en cours de route). */
function scoresM1() {
  const s = {};
  DUOS.forEach(d => s[d.id] = 0);
  Object.keys(S.m1marks).forEach(qi => {
    const q = M1[qi];
    if (q) Object.keys(S.m1marks[qi]).forEach(id => { if (id in s) s[id] += q.pts; });
  });
  return s;
}

function scoresM2() {
  const s = {};
  S.m2order.forEach(id => {
    s[id] = S.m2marks[id + "-j"] ? 3 : 0;
    for (let k = 1; k < M2_TOURS; k++) if (S.m2marks[id + "-r" + k]) s[id] += 2;
  });
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.screen) {
        S = hydrate(Object.assign(freshState(), p));
        S.tRunning = false;
        return true;
      }
    }
  } catch (e) {}
  S = freshState();
  return false;
}

/* ============================ TIMER ============================ */

let tick = null;

function startTimer() {
  if (S.tRunning) { stopTimer(); return; }
  if (S.tLeft <= 0) S.tLeft = CHRONO;
  S.tRunning = true;
  S.tStart = Date.now();
  const base = S.tLeft;
  clearInterval(tick);
  tick = setInterval(() => {
    const left = base - (Date.now() - S.tStart) / 1000;
    S.tLeft = Math.max(0, left);
    if (S.tLeft <= 0) { S.tRunning = false; clearInterval(tick); tick = null; }
    paintTimer();
  }, 90);
  render();
}

function stopTimer() {
  S.tRunning = false;
  clearInterval(tick);
  tick = null;
  render();
}

function resetTimer() {
  S.tRunning = false;
  S.tLeft = CHRONO;
  clearInterval(tick);
  tick = null;
}

function paintTimer() {
  const c = document.getElementById("count");
  const bar = document.getElementById("tbar");
  const ring = document.getElementById("ring");
  if (!c) return;
  const v = Math.ceil(S.tLeft);
  c.textContent = v;
  const urgent = S.tLeft <= 5 && S.tLeft > 0;
  c.className = "count" + (urgent ? " urgent" : (S.tLeft <= 0 ? " done" : ""));
  if (ring) ring.setAttribute("class", "ring" + (urgent ? " urgent" : ""));
  if (bar) {
    const CIRC = 2 * Math.PI * 30;
    bar.style.strokeDasharray = CIRC;
    bar.style.strokeDashoffset = CIRC * (1 - S.tLeft / CHRONO);
  }
}

function render() {

/* ================= RÉVÉLATION D'UNE QUESTION =================
   Chaque nouvelle question s'ouvre : la bulle arrive, puis le texte
   se dévoile de gauche à droite. L'animation ne se rejoue jamais sur
   un simple re-rendu (point attribué, option révélée, panneau ouvert) :
   elle est conditionnée à l'identité de la question affichée.

   Le faux départ d'un Joker emprunte exactement la même entrée, puis
   se fait barrer et détruire avant de céder la place à la vraie
   question — qui se révèle à son tour.
   ============================================================= */

const REVEAL_MS = 800;    // durée de la révélation
const GAG_HOLD  = 3000;   // temps de lecture du faux départ, après la révélation
const GAG_RAYE  = 520;    // tracé du trait
const GAG_CASSE = 620;    // dislocation du texte

let derniereQuestion = null;
let gagTimers = [];
const gagFait = {};       // faux départs déjà joués, pour ne pas les rejouer

// Identité de la question affichée. Change => on rejoue la révélation.
function cleQuestion() {
  if (S.screen === "m1") return "m1|" + S.m1i;
  if (S.screen === "m3") return "m3|" + S.m3i + (S.sudden ? "|s" : "");
  if (S.screen === "m2") {
    const d = m2duo();
    if (!d) return null;
    if (S.m2step === 0) {
      const j = jokerDe(d);
      const gag = !!(j.gag && j.gag.trim()) && !gagFait[d.id + "|joker"];
      return d.id + "|joker" + (gag ? "|gag" : "");
    }
    const rk = d.id + "-r" + S.m2step;
    if (!S.m2cat[rk]) return null;          // écran de choix de thème
    return rk + "|" + S.m2drawn[rk];
  }
  return null;
}

// Quand un overlay précède (annonce de duo, transition Éclair, splash…),
// la scène n'apparaît qu'après lui. La révélation doit attendre ce moment,
// sinon elle se joue derrière l'overlay et personne ne la voit.
function delaiScene() {
  const st = document.getElementById("stage");
  if (!st) return 0;
  if (st.classList.contains("enter-late")) return 1550;
  if (st.classList.contains("enter-break")) return 1150;
  if (st.classList.contains("enter")) return 950;
  if (st.classList.contains("enter-fast")) return 500;
  return 0;
}

function appliquerRevelation() {
  const k = cleQuestion();
  if (k === null) { derniereQuestion = null; annulerGag(); return; }
  if (k === derniereQuestion) return;
  derniereQuestion = k;

  const h1 = document.querySelector(".question");
  if (!h1) return;
  const d = delaiScene();
  h1.style.setProperty("--qdelay", d + "ms");
  h1.classList.remove("reveal");
  void h1.offsetWidth;                      // redémarre l'animation
  h1.classList.add("reveal");

  annulerGag();
  if (h1.classList.contains("is-gag")) planifierGag(h1, d);
}

function annulerGag() {
  gagTimers.forEach(clearTimeout);
  gagTimers = [];
}

function planifierGag(h1, delai) {
  const d = m2duo();
  if (!d) return;
  const cle = d.id + "|joker";
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // le compte des 3 secondes ne démarre qu'une fois la question réellement lisible
  const attente = still ? 1200 : (delai || 0) + REVEAL_MS + GAG_HOLD;

  gagTimers.push(setTimeout(() => {
    if (!h1.isConnected) return;
    h1.classList.add("gag-raye");                    // 1. le trait se trace
    gagTimers.push(setTimeout(() => {
      if (!h1.isConnected) return;
      h1.classList.add("gag-casse");                 // 2. le texte se disloque
      gagTimers.push(setTimeout(() => {
        gagFait[cle] = true;                         // 3. la vraie question prend sa place
        render();
      }, still ? 0 : GAG_CASSE));
    }, still ? 0 : GAG_RAYE));
  }, attente));
}

/* Pluie de cœurs : même technique que le champ de l'annonce — sprites
   pré-rendus, canvas en résolution réduite — mais avec de la physique
   (vitesse, gravité, rotation) et beaucoup moins de particules. */
function startConfetti(cv) {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  const RES = .62;
  cv.width = Math.round(W * RES); cv.height = Math.round(H * RES);
  const ctx = cv.getContext("2d");
  ctx.scale(RES, RES);

  const couleurs = ["#E5231F", "#FFCE00", "#FFFFFF", "#FF6A5E", "#1E56A0"];
  const tailles = [14, 20, 27];
  const sprites = [];
  couleurs.forEach(c => tailles.forEach(t => sprites.push({ img: heartSprite(t * 2, 1, c), s: t })));

  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const parts = [];
  for (let i = 0; i < 130; i++) {
    const sp = sprites[(Math.random() * sprites.length) | 0];
    const depuisLeBas = i % 3 === 0;   // un tiers jaillit du bas, le reste pleut
    parts.push({
      x: depuisLeBas ? W * (.3 + Math.random() * .4) : Math.random() * W,
      y: depuisLeBas ? H + 30 : -Math.random() * H * .9 - 20,
      vx: depuisLeBas ? (Math.random() - .5) * 7 : (Math.random() - .5) * 1.6,
      vy: depuisLeBas ? -(9 + Math.random() * 6) : 1.5 + Math.random() * 2.5,
      rot: Math.random() * 6.28,
      vr: (Math.random() - .5) * .16,
      sp: sp
    });
  }

  let last = performance.now();
  const t0 = last;

  function frame(now) {
    if (!cv.isConnected) return;
    const dt = Math.min(2.4, (now - last) / 16.67);
    last = now;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (!still) {
        p.vy += .22 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 40) { p.y = -30; p.vy = 1.5 + Math.random() * 2.5; p.x = Math.random() * W; }
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(p.sp.img, -p.sp.s / 2, -p.sp.s / 2, p.sp.s, p.sp.s);
      ctx.restore();
    }
    if (!still && now - t0 < VICTORY_MS) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Champ de cœurs façon trame, dessiné sur un canvas : à cette densité
// (~1500 cœurs) un rendu DOM tombait à 15 fps, le canvas tient les 60.
// La vague (.ann-sweep) balaie de -60vw à 120vw en 1,15 s ; chaque cœur
// gonfle au moment précis où elle lui passe dessus.
const HEART_PITCH = 30;                 // pas de la trame, en px
const HEART_TILT  = 6 * Math.PI / 180;  // léger angle descendant
const HEART_SWEEP = 1.15;

function heartSprite(size, alpha, couleur) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  const u = size / 100;
  x.fillStyle = couleur || ("rgba(255,255,255," + alpha + ")");
  x.beginPath();
  x.moveTo(50 * u, 88 * u);
  x.bezierCurveTo(20 * u, 66 * u, 2 * u, 47 * u, 2 * u, 30 * u);
  x.bezierCurveTo(2 * u, 14 * u, 14 * u, 4 * u, 27 * u, 4 * u);
  x.bezierCurveTo(37 * u, 4 * u, 45 * u, 10 * u, 50 * u, 18 * u);
  x.bezierCurveTo(55 * u, 10 * u, 63 * u, 4 * u, 73 * u, 4 * u);
  x.bezierCurveTo(86 * u, 4 * u, 98 * u, 14 * u, 98 * u, 30 * u);
  x.bezierCurveTo(98 * u, 47 * u, 80 * u, 66 * u, 50 * u, 88 * u);
  x.closePath();
  x.fill();
  return c;
}

// profil d'un cœur : petit → gonflé au passage de la vague → légèrement retombé
function heartWaveAt(lt) {
  const D = .8;
  if (lt <= 0) return [.55, .16];
  if (lt >= D) return [.88, .27];
  const p = lt / D;
  if (p < .38) {
    const e = 1 - Math.pow(1 - p / .38, 3);
    return [.55 + e, .16 + .36 * e];
  }
  const e = 1 - Math.pow(1 - (p - .38) / .62, 3);
  return [1.55 - .67 * e, .52 - .25 * e];
}

function startHeartField(cv) {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  // Texture de fond très transparente : on la rend à résolution réduite et
  // le navigateur l'étire. Invisible à l'œil, ~3x moins de pixels à peindre.
  const RES = .58;
  cv.width = Math.round(W * RES); cv.height = Math.round(H * RES);
  const ctx = cv.getContext("2d", { alpha: true });
  ctx.scale(RES, RES);

  const SP = 14;   // taille de base du cœur : nettement plus petite que le pas

  // 24 états pré-rendus (taille ET opacité cuites dans le sprite) : chaque
  // frame n'est plus qu'une recopie 1:1, sans redimensionnement ni changement
  // d'alpha — c'est ce qui fait tenir les 60 fps à cette densité.
  const STAGES = 24, WAVE_D = .8;
  const sprites = [];
  for (let k = 0; k < STAGES; k++) {
    const [sc, al] = heartWaveAt(k / (STAGES - 1) * WAVE_D);
    const px = Math.max(4, Math.round(SP * sc));
    sprites.push({ img: heartSprite(px, al.toFixed(3)), s: px });
  }

  const cos = Math.cos(HEART_TILT), sin = Math.sin(HEART_TILT);
  const cols = Math.ceil(W * 1.6 / HEART_PITCH);
  const rows = Math.ceil(H * 1.6 / HEART_PITCH);
  const ox = W / 2 - cols * HEART_PITCH / 2;
  const oy = H / 2 - rows * HEART_PITCH / 2;

  const pts = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u = ox + (c + (r % 2 ? .5 : 0)) * HEART_PITCH - W / 2;
      const v = oy + r * HEART_PITCH - H / 2;
      const x = W / 2 + u * cos - v * sin;
      const y = H / 2 + u * sin + v * cos;
      if (x < -SP * 2 || x > W + SP * 2 || y < -SP * 2 || y > H + SP * 2) continue;
      pts.push([x, y, (x / W * 100 + 37.5) / 180 * HEART_SWEEP]);
    }
  }

  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now();

  function frame(now) {
    if (!cv.isConnected) return;
    const t = still ? 99 : (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let k = Math.round((t - p[2]) / WAVE_D * (STAGES - 1));
      if (k < 0) k = 0; else if (k >= STAGES) k = STAGES - 1;
      const sp = sprites[k];
      ctx.drawImage(sp.img, (p[0] - sp.s / 2) | 0, (p[1] - sp.s / 2) | 0);
    }
    if (!still && t < HEART_SWEEP + 1.2) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function playAnnounce() {
  const d = m2duo();
  if (!d) return;
  const step = S.m2step === 0 ? "🃏 Joker — 3 points" : "🗂️ " + m2StepLabel(S.m2step) + " — 2 points";

  document.querySelectorAll(".announce").forEach(n => n.remove());
  clearTimeout(announceTimer);

  const n = el(`<div class="announce" aria-hidden="true">
      <canvas class="ann-hearts"></canvas>
      <div class="ann-sweep"></div>
      <div class="ann-inner">
        <div class="ann-lead">Maintenant, c'est à</div>
        <div class="ann-who">${m2IsQcm() ? esc(duoName(d)) : duoNameCible(d, S.m2step)}</div>
        <div class="ann-bar"></div>
        <div class="ann-step">${esc(step)}</div>
      </div>
    </div>`);
  document.body.appendChild(n);
  startHeartField(n.querySelector(".ann-hearts"));
  announceTimer = setTimeout(() => n.remove(), ANNOUNCE_MS);

  const stage = document.getElementById("stage");
  stage.classList.remove("enter", "enter-late");
  void stage.offsetWidth;            // force le redémarrage de l'animation
  stage.classList.add("enter");
}

  return compact ? base + " compact" : base;
}

// Toute question à QCM s'affiche en bulle compacte (qCls(t, true)), options
// masquées ou non : la place des options est réservée d'avance, et la bulle ne
// change pas de taille au moment où on appuie sur R.

function m2duo() { return byId(S.m2order[S.m2i]); }

/* --- Manche 3 « Longueur d'onde » : chaque duo a des cœurs, il en perd un
   à chaque question où les deux membres n'écrivent pas la même chose.
   On stocke les échecs par question ("3|ak") plutôt qu'un compteur : un clic
   de trop se corrige d'un second clic, même plusieurs questions plus tard. --- */


function m3Fails(id) {
  return Object.keys(S.m3marks || {}).filter(k => k.split("|")[1] === id).length;
}
function m3Lives(id) { return Math.max(0, M3_LIVES - m3Fails(id)); }
function m3Out(id)   { return m3Lives(id) === 0; }
function m3Failed(id) { return !!(S.m3marks || {})[S.m3i + "|" + id]; }

// rangée de cœurs : pleins = restants, barrés = perdus
function heartRow(id) {
  const left = m3Lives(id);
  let h = "";
  for (let k = 0; k < M3_LIVES; k++) h += `<span class="hp ${k < left ? "" : "lost"}">♥</span>`;
  return `<span class="hprow">${h}</span>`;
}

// Un QCM n'a pas de cible : les deux partenaires choisissent une lettre.
function m2IsQcm() {
  const d = m2duo();
  if (!d) return false;
  if (S.m2step === 0) return aDesOptions(jokerDe(d).opts);
  const rk = d.id + "-r" + S.m2step;
  const catKey = S.m2cat[rk];
  if (!catKey) return false;
  const cat = categorieParId(catKey);
  const item = cat && cat.questions[S.m2drawn[rk]];
  return !!item && aDesOptions(item.opts);
}

SCREENS.m2 = {
  top: () => {
    const d = m2duo();
    const step = m2StepLabel(S.m2step);
    return railBase(`Manche 2 · <strong>${m2IsQcm() ? esc(duoName(d)) : duoNameCible(d, S.m2step)}</strong> · ${step} · Duo ${S.m2i + 1}/${S.m2order.length}`, pips(S.m2order.length, S.m2i));
  },
  stage: () => {
    const d = m2duo();
    const key = d.id;

    if (S.m2step === 0) {
      const j = jokerDe(d);
      // le faux départ occupe la place de la question tant qu'il n'a pas été joué
      const montreGag = !!(j.gag && j.gag.trim()) && !gagFait[d.id + "|joker"];
      const qcm = aDesOptions(j.opts);
      return `
        <div class="kicker"><span class="tag">🃏 Joker</span><span>3 points</span><span style="color:var(--muted)">sur-mesure — c'est le moment de la manche</span></div>
        ${montreGag ? `
          <h1 class="question is-gag ${qCls(j.gag)}"><span class="qtxt">${esc(j.gag)}</span><i class="strike"></i></h1>`
        : `
          <h1 class="question ${qCls(j.q, qcm)}"><span class="qtxt">${qText(j.q, cibleName(d, S.m2step))}</span></h1>
          ${rolesBand(d, S.m2step, qcm)}`}
        ${qcm ? qcmBlock(j.opts) : ""}
        ${timerBlock()}
        ${awardRow(key + "-j", 3)}`;
    }

    const roundKey = key + "-r" + S.m2step;

    if (!S.m2cat[roundKey]) {
      return `
        <div class="kicker"><span class="tag">🗂️ Catégorie</span><span>${esc(duoName(d))} annonce son thème</span></div>
        <h1 class="question">Quel thème ?</h1>
        <div class="subline">Une question est tirée au hasard dans le thème choisi, puis retirée de la pile.</div>
        <div class="cats">
          ${PACK.categories.map(c => {
            const left = c.questions.length - ((S.m2used && S.m2used[c.id]) || []).length;
            return `<button class="btn" data-act="pickcat" data-cat="${c.id}" ${left <= 0 ? "disabled" : ""}>${esc(c.label)} <span style="color:var(--muted)">(${left})</span></button>`;
          }).join("")}
        </div>`;
    }

    const cat = categorieParId(S.m2cat[roundKey]);
    if (!cat) return `<div class="subline">Catégorie introuvable — reviens en arrière et rechoisis.</div>`;
    const qi = S.m2drawn[roundKey];
    const item = cat.questions[qi] || { q: "", opts: [] };
    const qtext = item.q;
    const opts = aDesOptions(item.opts) ? item.opts : null;
    return `
      <div class="kicker"><span class="tag">${esc(cat.label)}</span><span>2 points</span>
        ${opts ? '<span style="color:var(--muted)">QCM — les DEUX doivent choisir la même lettre</span>' : ""}</div>
      <h1 class="question ${qCls(qtext, !!opts)}"><span class="qtxt">${qText(qtext, cibleName(d, S.m2step))}</span></h1>
      ${rolesBand(d, S.m2step, !!opts)}
      ${opts ? qcmBlock(opts) : ""}
      ${timerBlock()}
      ${awardRow(roundKey, 2)}`;
  },
  bottom: () => {
    const d = m2duo();
    const needCat = S.m2step > 0 && !S.m2cat[d.id + "-r" + S.m2step];
    const last = S.m2step === M2_TOURS - 1 && S.m2i === S.m2order.length - 1;
    return `
      ${boutonsChrono()}
      <div class="spacer"></div>
      <button class="btn ghost" data-act="m2prev" ${S.m2i === 0 && S.m2step === 0 ? "disabled" : ""}>Précédent<kbd>←</kbd></button>
      <button class="btn primary" data-act="m2next" ${needCat ? "disabled" : ""}>${last ? "Clore la Manche 2" : "Suivant"}<kbd>→</kbd></button>`;
  }
};

// mis à vrai par la touche R, consommé au rendu suivant : seule l'option
// qui vient d'apparaître s'anime (attribuer un point ne la fait pas rejouer)
let optJustRevealed = false;

function qcmBlock(opts) {
  const shown = (S.revealCount || 0) % (opts.length + 1);
  const pop = optJustRevealed;
  optJustRevealed = false;
  if (shown === 0) {
    return `<div class="hidden-note">Options masquées — lis l'intitulé, puis <kbd>R</kbd> pour les révéler une par une.</div>`;
  }
  return `<div class="options">${opts.slice(0, shown).map((o, i) =>
    `<div class="option${pop && i === shown - 1 ? " pop" : ""}"><span class="letter">${"ABCDEF"[i]}</span><span>${esc(o)}</span></div>`).join("")}</div>`;
}

function awardRow(markKey, pts) {
  const on = !!S.m2marks[markKey];
  const d = m2duo();
  const label = m2IsQcm()
    ? `Ça matche ? — <span style="color:var(--amber)">les DEUX doivent avoir choisi la même lettre</span>`
    : `Ça matche ? — <span style="color:var(--amber)">${esc(cibleName(d, S.m2step))}</span> écrit sur l'ardoise, `
      + `<span style="color:var(--amber)">${esc(devineurName(d, S.m2step))}</span> devine`;
  return `<div>
    <div class="eyebrow" style="margin-bottom:11px">${label}</div>
    <div class="scorerow">
      <button class="chip ${on ? "on" : ""}" data-act="m2mark" data-key="${markKey}" data-pts="${pts}">
        <span class="mark">${on ? "✓" : ""}</span>Accordé — ${pts} pt${pts > 1 ? "s" : ""}</button>
    </div>
  </div>`;
}

/* ---------- résultats manche 2 ---------- */

      <div class="ranks">

SCREENS.m3 = {

    S.sudden

    S.sudden ? "" : S.finalists.map(id => `<span class="eyebrow" style="margin-right:18px">${esc(duoName(byId(id)))} ${heartRow(id)}</span>`).join("")),
  stage: () => {
    const q = M3[S.m3i % M3.length];
    return `
      <div class="kicker"><span class="tag">${S.sudden ? "☠️ Mort subite" : "🏆 Longueur d'onde"}</span>
        <span>${S.sudden ? "plus de cœurs : le premier qui matche gagne" : M3_LIVES + " cœurs par duo"}</span>
        <span style="color:var(--muted)">les DEUX membres écrivent à l'aveugle, on révèle ensemble</span></div>
      <h1 class="question ${qCls(q)}"><span class="qtxt">${esc(q)}</span></h1>
      ${S.sudden
        ? `<div class="roles fini">Les cœurs ne comptent plus · <b>le premier duo qui matche remporte la partie</b> · si les deux matchent ou si les deux ratent, on enchaîne</div>`

        <div class="scorerow">

            ? S.finalists.map(id => `<button class="chip win" data-act="sdwin" data-id="${id}">

            : S.finalists.map(id => `<button class="chip ${m3Failed(id) ? "fail" : ""}" data-act="m3mark" data-id="${id}" ${m3Out(id) && !m3Failed(id) ? "disabled" : ""}>
                <span class="mark">${m3Failed(id) ? "✗" : ""}</span>${esc(duoName(byId(id)))} ${heartRow(id)}</button>`).join("")}

      ${boutonsChrono()}

      <button class="btn primary" data-act="m3next">Question suivante<kbd>→</kbd></button>`;
    const ko = S.finalists.filter(m3Out);
    const egalite = m3Lives(S.finalists[0]) === m3Lives(S.finalists[1]);
    return `
    ${boutonsChrono()}
    <div class="spacer"></div>

    <button class="btn primary" data-act="m3next" ${ko.length ? "disabled" : ""}>Question suivante<kbd>→</kbd></button>
    ${egalite
      ? `<button class="btn ${ko.length ? "primary" : "ghost"}" data-act="startsudden" style="margin-left:10px">☠️ Lancer la mort subite</button>`
      : `<button class="btn ${ko.length ? "primary" : "ghost"}" data-act="finish" style="margin-left:10px">Déclarer le vainqueur</button>`}`;

};

// Résultat de la partie, utilisé par l'écran de clôture ET par l'animation
// de victoire : une seule source de vérité, pas de risque de divergence.
function endResult() {
  if (S.suddenWinner && S.finalists.includes(S.suddenWinner)) {
    const perdant = S.finalists.find(id => id !== S.suddenWinner);
    return { egalite: false, win: duoName(byId(S.suddenWinner)),
      sub: `Départagés en mort subite : ${duoName(byId(S.suddenWinner))} a matché avant ${duoName(byId(perdant))}.` };
  }
  if (S.finalists.length === 2) {
    const [x, y] = S.finalists;
    const lx = m3Lives(x), ly = m3Lives(y);
    if (lx === ly) {
      return { egalite: true, win: "Mort subite",
        sub: lx === 0
          ? `${duoName(byId(x))} et ${duoName(byId(y))} ont perdu leurs ${M3_LIVES} cœurs sur la même question. On rejoue : le premier duo qui matche l'emporte.`
          : `${duoName(byId(x))} et ${duoName(byId(y))} sont à égalité, ${lx} cœur${lx > 1 ? "s" : ""} chacun. Question suivante : le premier duo qui ne matche pas a perdu.` };
    }
    const w = lx > ly ? x : y, l = lx > ly ? y : x;
    const restants = Math.max(lx, ly);
    return { egalite: false, win: duoName(byId(w)),
      sub: m3Lives(l) === 0
        ? `${duoName(byId(l))} a perdu ses ${M3_LIVES} cœurs. ${duoName(byId(w))} termine avec ${restants} cœur${restants > 1 ? "s" : ""}.`
        : `${restants} cœurs contre ${Math.min(lx, ly)} à la fin de la Longueur d'onde.`,
      coeurs: restants };
  }
  const sc = scoresM2();
  const r = rank(sc, alive());
  return { egalite: false, win: r[0] ? duoName(r[0]) : "—",
    sub: `Partie close à la fin de la Manche 2, sur le score de la Manche 2 : ${r[0] ? (sc[r[0].id] || 0) : 0} points.` };
}

SCREENS.end = {
  top: () => railBase("Clôture"),

    return `

};
